<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Request Quote | TDL Energy Indonesia</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;600;700&display=swap" rel="stylesheet">

    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDwF8_Q9S1-naaAgyfMWhFYJ2u_be3wsBs",
            authDomain: "tdlid-107669.firebaseapp.com",
            databaseURL: "https://tdlid-107669-default-rtdb.firebaseio.com",
            projectId: "tdlid-107669",
            storageBucket: "tdlid-107669.firebasestorage.app",
            messagingSenderId: "604782345004",
            appId: "1:604782345004:web:029aeaa81f4d11c2254a89"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
    </script>

    <style>
        body {
            -webkit-user-select: auto;
            user-select: auto;
            overflow-x: hidden;
        }

        input,
        textarea,
        select {
            user-select: auto !important;
            -webkit-user-select: auto !important;
            font-size: 16px !important;
        }

        .contact-form-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .form-card {
            max-width: 100%;
            width: 100%;
            margin: 0 auto;
        }

        .stealth-link {
            cursor: text !important;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .hero-slogan-gradient {
            display: inline-block !important;
            font-weight: 900 !important;
            line-height: 1.2 !important;
            padding-bottom: 0.1em;
            background: linear-gradient(to right, #0891b2 0%, #22d3ee 50%, #ffffff 100%) !important;
            -webkit-background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
            background-clip: text !important;
            color: transparent !important;
        }
    </style>
</head>

<body class="bg-neutral-950 text-neutral-100 font-[Pretendard]">

    <div id="header-placeholder"></div>

    <main class="pt-24 pb-12 px-5 contact-form-container">
        <div class="form-card bg-neutral-900/80 border border-neutral-800 p-6 rounded-2xl shadow-2xl relative">
            <h2 data-i18n="hero_title" class="text-5xl font-black tracking-tight hero-slogan-gradient mb-4">
                Talk to us about your goals
            </h2>
            <p class="text-sm text-neutral-400 mb-8 leading-relaxed">
                <span data-i18n="hero_desc">Complete the form below and discover how we can help</span> <span
                    id="triggerOur" class="stealth-link">you</span>.
            </p>

            <form id="quoteForm" class="flex flex-col gap-4">
                <div class="space-y-4">
                    <input name="company"
                        class="w-full p-4 rounded-xl bg-neutral-800/50 border border-neutral-700 focus:border-cyan-500 outline-none transition placeholder:text-neutral-500"
                        required>
                    <input name="email" type="email"
                        class="w-full p-4 rounded-xl bg-neutral-800/50 border border-neutral-700 focus:border-cyan-500 outline-none transition placeholder:text-neutral-500"
                        required>
                    <input name="phone"
                        class="w-full p-4 rounded-xl bg-neutral-800/50 border border-neutral-700 focus:border-cyan-500 outline-none transition placeholder:text-neutral-500">

                    <div class="relative">
                        <select name="product" id="quoteProductSelect"
                            class="w-full p-4 rounded-xl bg-neutral-800/50 border border-neutral-700 focus:border-cyan-500 outline-none transition text-neutral-300 appearance-none">
                        </select>
                    </div>

                    <textarea name="details" rows="5"
                        class="w-full p-4 rounded-xl bg-neutral-800/50 border border-neutral-700 focus:border-cyan-500 outline-none transition placeholder:text-neutral-500"></textarea>
                </div>

                <button type="submit" id="submitBtn" data-i18n="submit_btn"
                    class="w-full mt-2 py-4 rounded-xl bg-cyan-500 active:bg-cyan-600 text-black font-bold transition-all shadow-lg shadow-cyan-500/20">
                    Submit Request
                </button>
            </form>

            <p id="formStatus" class="mt-4 text-center text-sm font-medium"></p>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script>
        // [다국어 데이터 설정]
        const translations = {
            en: {
                hero_title: "Talk to us about your goals",
                hero_desc: "Complete the form below and discover how we can help",
                company_ph: "Company / Name",
                email_ph: "Email Address",
                phone_ph: "Phone / WhatsApp (Optional)",
                details_ph: "Project details, required quantity, etc.",
                select_opt: ["-- Select Product (Optional) --", "72V 20Ah Battery Pack", "EV Conversion Kit", "Solar Home Charging Solution", "Battery Recycling Program", "Other / General Inquiry"],
                submit_btn: "Submit Request",
                status_storing: "Storing Request...",
                status_success: "✅ Submitted successfully!<br><span class='text-sm font-normal'>We will get back to you shortly.</span>",
                status_error: "❌ Error saving data."
            },
            id: {
                hero_title: "Bicarakan tujuan Anda",
                hero_desc: "Isi formulir di bawah ini dan temukan bagaimana kami dapat membantu Anda",
                company_ph: "Perusahaan / Nama",
                email_ph: "Alamat Email",
                phone_ph: "Telepon / WhatsApp (Opsional)",
                details_ph: "Rincian proyek, jumlah yang dibutuhkan, dll.",
                select_opt: ["-- Pilih Produk (Opsional) --", "Paket Baterai 72V 20Ah", "Kit Konversi EV", "Solusi Pengisian Daya Rumah Tenaga Surya", "Program Daur Ulang Baterai", "Pertanyaan Lain / Umum"],
                submit_btn: "Kirim Permintaan",
                status_storing: "Menyimpan Permintaan...",
                status_success: "✅ Berhasil dikirim!<br><span class='text-sm font-normal'>Kami akan segera menghubungi Anda.</span>",
                status_error: "❌ Gagal menyimpan data."
            }
        };

        function applyLanguage(lang) {
            const t = translations[lang] || translations.en;

            // 텍스트 변경
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) el.innerHTML = t[key];
            });

            // 플레이스홀더 변경
            document.querySelector('[name="company"]').placeholder = t.company_ph;
            document.querySelector('[name="email"]').placeholder = t.email_ph;
            document.querySelector('[name="phone"]').placeholder = t.phone_ph;
            document.querySelector('[name="details"]').placeholder = t.details_ph;

            // 셀렉트 박스 옵션 변경
            const select = document.getElementById('quoteProductSelect');
            const values = ["", "72V 20Ah Battery Pack", "EV Conversion Kit", "Solar Home Charging Solution", "Battery Recycling Program", "Other / General Inquiry"];
            select.innerHTML = '';
            t.select_opt.forEach((text, i) => {
                const opt = document.createElement('option');
                opt.value = values[i];
                opt.innerText = text;
                select.appendChild(opt);
            });
        }

        async function loadLayout() {
            try {
                const [headerRes, footerRes] = await Promise.all([
                    fetch('components/header_m.html'),
                    fetch('components/footer_m.html')
                ]);

                const headerText = await headerRes.text();
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = headerText;
                const adminLink = tempDiv.querySelector('a[href="admin.html"]');
                if (adminLink) adminLink.remove();
                document.getElementById('header-placeholder').innerHTML = tempDiv.innerHTML;

                const footerPlaceholder = document.getElementById('footer-placeholder');
                footerPlaceholder.innerHTML = await footerRes.text();

                // 헤더 로드 후 스크립트 실행
                const headerScripts = document.getElementById('header-placeholder').querySelectorAll("script");
                headerScripts.forEach(oldScript => {
                    const newScript = document.createElement("script");
                    newScript.text = oldScript.text;
                    document.body.appendChild(newScript).parentNode.removeChild(newScript);
                });

                // 초기 언어 적용 (localStorage 확인)
                const savedLang = localStorage.getItem('selectedLang') || 'en';
                applyLanguage(savedLang);

                // 페이지 전용 초기화
                if (typeof initMenuToggle === 'function') initMenuToggle();
                if (typeof initFormHandler === 'function') initFormHandler();
                if (typeof initEeggTrigger === 'function') initEeggTrigger();

            } catch (err) {
                console.error("Layout load failed:", err);
            }
        }

        function initEeggTrigger() {
            const trigger = document.getElementById('triggerOur');
            if (trigger) {
                trigger.onclick = () => { window.location.href = 'e-egg_m.html'; };
            }
        }

        function initMenuToggle() {
            const menuBtn = document.getElementById("menuToggleBtn");
            const dropdown = document.getElementById("dropdownMenu");
            const menuIcon = document.getElementById("menuIcon");
            if (menuBtn && dropdown) {
                menuBtn.onclick = (e) => {
                    e.stopPropagation();
                    const isOpen = dropdown.classList.contains("opacity-100");
                    if (!isOpen) {
                        dropdown.classList.remove("opacity-0", "invisible", "translate-y-[-10px]");
                        dropdown.classList.add("opacity-100", "visible", "translate-y-2");
                        if (menuIcon) menuIcon.innerText = "✕";
                    } else { closeMenu(); }
                };
                function closeMenu() {
                    dropdown.classList.remove("opacity-100", "visible", "translate-y-2");
                    dropdown.classList.add("opacity-0", "invisible", "translate-y-[-10px]");
                    if (menuIcon) menuIcon.innerText = "☰";
                }
                document.addEventListener("click", (e) => {
                    if (!dropdown.contains(e.target) && !menuBtn.contains(e.target)) closeMenu();
                });
            }
        }

        function initFormHandler() {
            const form = document.getElementById('quoteForm');
            const formStatus = document.getElementById('formStatus');

            if (form) {
                form.onsubmit = async (e) => {
                    e.preventDefault();

                    // 현재 설정된 언어 가져오기
                    const currentLang = localStorage.getItem('selectedLang') || 'en';
                    const t = translations[currentLang];

                    // 제출 버튼 비활성화 (모바일은 id가 'submitBtn'으로 설정된 경우 대응)
                    const submitBtn = document.getElementById('submitBtn') || form.querySelector('button[type="submit"]');
                    if (submitBtn) {
                        submitBtn.disabled = true;
                        submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
                    }

                    // 로딩 메시지 다국어 적용
                    formStatus.innerHTML = t.status_storing;
                    formStatus.className = 'mt-6 text-center text-lg text-cyan-400 animate-pulse';

                    try {
                        const formData = new FormData(form);
                        const msgData = {
                            timestamp: Date.now(),
                            date: new Date().toLocaleString(),
                            company: formData.get('company'),
                            email: formData.get('email'),
                            phone: formData.get('phone') || 'N/A',
                            product: formData.get('product') || 'None Selected',
                            details: formData.get('details') || '',
                            read: false,
                            status: 'new'
                        };

                        const timeoutPromise = new Promise((_, reject) =>
                            setTimeout(() => reject(new Error('Timeout')), 10000)
                        );

                        await Promise.race([
                            database.ref('messages').push(msgData),
                            timeoutPromise
                        ]);

                        // ✅ 성공 메시지 + 하단 안내 문구 다국어 적용
                        const subText = currentLang === 'id'
                            ? 'Kami akan segera menghubungi Anda.'
                            : 'We will get back to you shortly.';

                        formStatus.innerHTML = `${t.status_success}<br><span class="text-sm font-normal">${subText}</span>`;
                        formStatus.className = 'mt-6 text-center text-lg text-green-500 font-bold';
                        form.reset();

                    } catch (error) {
                        console.error("Submission Error:", error);
                        // ❌ 에러 메시지 다국어 적용
                        formStatus.innerHTML = t.status_error;
                        formStatus.className = 'mt-6 text-center text-lg text-red-500 font-medium';
                    } finally {
                        // 버튼 복구
                        if (submitBtn) {
                            submitBtn.disabled = false;
                            submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                        }
                    }
                };
            }
        }

        document.addEventListener("DOMContentLoaded", loadLayout);
    </script>

</body>

</html>
