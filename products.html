<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script>
        (function(){const isMobileOnly=/iPhone|iPod|Android/i.test(navigator.userAgent);const urlParams=new URLSearchParams(window.location.search);const isPCMode=urlParams.get('view_mode')==='pc';if(isMobileOnly&&!isPCMode){let path=window.location.pathname;let page=path.split("/").pop();if(page===""||page==="products.html"){window.location.href="products_m.html"}else if(page.endsWith(".html")&&!page.includes("_m.html")){window.location.href=page.replace(".html","_m.html")}}})();
    </script>
    <title>TDL Energy Indonesia — Products</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root{--accent:#00ffa3}.background-container{position:fixed;width:100vw;height:100vh;top:0;left:0;z-index:0;transform-style:preserve-3d;pointer-events:none;overflow:hidden}.dot{position:absolute;width:2px;height:2px;background:white;border-radius:50%;opacity:0.3}.ai-badge{display:inline-block;padding:6px 14px;border:1px solid var(--accent);border-radius:20px;font-size:0.75rem;color:var(--accent);background:rgba(0,255,163,0.05);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:1rem;backdrop-filter:blur(4px)}#productContentWrapper{transition:transform 0.8s ease-out,opacity 0.8s ease-out;width:100%}#galleryImageContainer{display:flex;align-items:center;justify-content:center;overflow:hidden;width:100%}#galleryImageContainer img{max-width:100%;max-height:100%;object-fit:contain;height:auto;transition:transform 0.3s ease}.modal-backdrop{position:fixed;inset:0;background-color:rgba(0,0,0,0.9);display:flex;justify-content:center;align-items:center;z-index:10002;padding:40px;backdrop-filter:blur(8px)}.modal-content{background:#0a0a0a;color:#ddd;padding:20px;border-radius:24px;max-width:900px;width:100%;max-height:90vh;text-align:center;border:1px solid #333;position:relative;overflow-y:auto;box-shadow:0 0 50px rgba(0,0,0,0.8)}body{overflow-x:hidden;-webkit-user-select:none;user-select:none;perspective:1000px;margin:0;padding:0;background-color:#050505}.gallery-card{width:100%;max-width:1024px;transform-style:preserve-3d;transition:transform 0.1s ease-out}
        .gallery-outer-container { position: relative; width: 100%; max-width: 1200px; padding: 0 80px; }
        .nav-btn-fixed { position: absolute; top: 50%; transform: translateY(-50%); z-index: 50; pointer-events: auto !important; }
        #galleryPrevBtn { left: 0; }
        #galleryNextBtn { right: 0; }
        .hero-slogan-gradient{display:inline-block !important;font-weight:900 !important;line-height:1.2 !important;padding-bottom:0.1em;background:linear-gradient(to right,#0891b2 0%,#22d3ee 50%,#ffffff 100%) !important;-webkit-background-clip:text !important;-webkit-text-fill-color:transparent !important;background-clip:text !important;color:transparent !important}
    </style>
</head>
<body class="bg-neutral-950 text-neutral-100 font-[Pretendard] flex flex-col min-h-screen">
    <div class="background-container" id="bg-stars"></div>
    
    <div id="header-placeholder"></div>

    <main class="flex-grow pt-32 lg:pt-40 pb-24 px-6 relative z-10">
        <div class="max-w-7xl mx-auto flex flex-col items-center">
            <div class="ai-badge" id="ai-msg">System: Loading Components...</div>
            <div class="relative flex flex-col items-center justify-center mb-16 w-full">
                <h3 class="text-4xl md:text-5xl font-black tracking-tight hero-slogan-gradient">TDLiD Products</h3>
            </div>

            <div class="gallery-outer-container">
                <button id="galleryPrevBtn" class="nav-btn-fixed w-14 h-14 md:w-16 md:h-16 flex items-center justify-center bg-neutral-800/80 backdrop-blur-md rounded-full border border-neutral-700 text-cyan-400 hover:bg-cyan-500 transition-all duration-300 shadow-lg">←</button>
                <div id="productGallery" class="gallery-card mx-auto p-4 md:p-8 bg-neutral-900/80 backdrop-blur-md rounded-[2rem] border border-neutral-800">
                    <div id="productContentWrapper" class="overflow-hidden">
                        <div id="galleryImageContainer" class="aspect-[16/10] bg-neutral-800/30 rounded-2xl p-4 md:p-10"></div>
                    </div>
                    <div class="flex flex-col items-center mt-6">
                        <span id="galleryStatus" class="text-neutral-500 font-mono text-sm md:text-lg uppercase font-bold"></span>
                    </div>
                </div>
                <button id="galleryNextBtn" class="nav-btn-fixed w-14 h-14 md:w-16 md:h-16 flex items-center justify-center bg-neutral-800/80 backdrop-blur-md rounded-full border border-neutral-700 text-cyan-400 hover:bg-cyan-500 transition-all duration-300 shadow-lg">→</button>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script>
        /* 1. 레이아웃 로드 함수 (상단 메뉴바 불러오기 핵심) */
        async function loadLayout() {
            try {
                // 헤더 로드
                const hRes = await fetch('components/header.html');
                const hHtml = await hRes.text();
                const hPlace = document.getElementById('header-placeholder');
                hPlace.innerHTML = hHtml;
                
                // 헤더 내 스크립트 실행 (메뉴 토글 등)
                hPlace.querySelectorAll("script").forEach(oldScript => {
                    const newScript = document.createElement("script");
                    newScript.text = oldScript.text;
                    document.body.appendChild(newScript).parentNode.removeChild(newScript);
                });

                // 푸터 로드
                const fRes = await fetch('components/footer.html');
                document.getElementById('footer-placeholder').innerHTML = await fRes.text();

                // 모바일 메뉴 토글 초기화 (컴포넌트 로드 후 실행)
                if (typeof initMenuToggle === "function") initMenuToggle();
            } catch (err) {
                console.error("Layout Load Error:", err);
            }
        }

        /* 2. 제품 갤러리 로직 */
        const productsData=[];for(let i=1;i<=32;i++){productsData.push({image:`images/products/image-${i}.webp`})}
        const wrapper=document.getElementById('productContentWrapper'), container=document.getElementById('galleryImageContainer'), status=document.getElementById('galleryStatus');
        let currentProductIndex=0, isAnimating=false;

        window.openImagePopup = (src,num) => {
            const m=document.createElement('div');m.className='modal-backdrop';
            m.innerHTML=`<div class="modal-content"><img src="${src}" class="modal-image"><button class="modal-close-btn" onclick="this.parentElement.parentElement.remove()">Close</button></div>`;
            document.body.appendChild(m);
        };

        function renderProduct(product,index){
            container.innerHTML=`<img src="${product.image}" class="max-h-full cursor-pointer hover:scale-105 transition-transform" onclick="openImagePopup('${product.image}', ${index+1})">`;
            status.textContent=`${(index+1).toString().padStart(2,'0')} / ${productsData.length}`;
        }

        function changeProduct(newIndex){
            if(isAnimating)return;isAnimating=true;
            wrapper.style.opacity='0';
            setTimeout(()=>{
                currentProductIndex=newIndex;renderProduct(productsData[currentProductIndex],currentProductIndex);
                wrapper.style.opacity='1';isAnimating=false;
            },400);
        }

        document.getElementById('galleryNextBtn').onclick=()=>changeProduct((currentProductIndex+1)%productsData.length);
        document.getElementById('galleryPrevBtn').onclick=()=>changeProduct((currentProductIndex-1+productsData.length)%productsData.length);

        /* 3. 초기화 */
        document.addEventListener("DOMContentLoaded", () => {
            loadLayout(); // 상단 메뉴바 로드 시작
            if(productsData.length>0) renderProduct(productsData[0],0);
        });

        // 배경 및 3D 효과
        const bg=document.getElementById('bg-stars');if(bg){for(let i=0;i<150;i++){const d=document.createElement('div');d.className='dot';d.style.left=`${Math.random()*100}%`;d.style.top=`${Math.random()*100}%`;bg.appendChild(d)}}
        const galleryCard=document.getElementById('productGallery');
        document.body.onmousemove=(e)=>{
            const x=(e.clientX-window.innerWidth/2)/30, y=(e.clientY-window.innerHeight/2)/30;
            if(galleryCard)galleryCard.style.transform=`rotateY(${x*0.8}deg) rotateX(${-y*0.8}deg)`;
        };
    </script>
</body>
</html>
