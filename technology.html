ion:absolute;top:50%;transform:translateY(-50%);z-index:30;width:60px;height:60px;display:flex;align-items:center;justify-content:center;background:rgba(20,20,20,.8);border:1px solid #333;border-radius:50%;color:#06b6d4;transition:all .4s;backdrop-filter:blur(10px)}.nav-btn:hover{background:#06b6d4;color:#000;border-color:#06b6d4;transform:translateY(-50%) scale(1.1)}#prevBtn{left:0}#nextBtn{right:0}.dropdown-link{padding:12px 20px;display:block;color:#ccc;border-bottom:1px solid #262626;transition:all .2s}.dropdown-link:hover{background-color:#1a1a1a;color:#22d3ee}.dropdown-quote-btn{padding:12px 20px;display:block;background:#22d3ee;color:#000;font-weight:600;text-align:center;border-radius:0 0 11px 11px}.custom-scrollbar::-webkit-scrollbar{width:6px}.custom-scrollbar::-webkit-scrollbar-thumb{background:#333;border-radius:10px}.custom-scrollbar::-webkit-scrollbar-thumb:hover{background:#06b6d4}.hero-slogan-gradient{display:inline-block!important;font-weight:900!important;line-height:1.2!important;padding-bottom:.1em;margin:0 auto;background:linear-gradient(to right,#0891b2 0%,#22d3ee 50%,#fff 100%)!important;-webkit-background-clip:text!important;-webkit-text-fill-color:transparent!important;background-clip:text!important;color:transparent!important}</style>

<script>
const firebaseConfig={apiKey:"AIzaSyDwF8_Q9S1-naaAgyfMWhFYJ2u_be3wsBs",authDomain:"tdlid-107669.firebaseapp.com",databaseURL:"https://tdlid-107669-default-rtdb.firebaseio.com",projectId:"tdlid-107669",storageBucket:"tdlid-107669.firebasestorage.app",messagingSenderId:"604782345004",appId:"1:604782345004:web:029aeaa81f4d11c2254a89"};
if(typeof firebase!=='undefined'&&!firebase.apps.length){firebase.initializeApp(firebaseConfig)}
const auth=firebase.auth(),database=firebase.database();
async function loadLayout(){try{const hRes=await fetch('components/header.html'),hHTML=await hRes.text(),hP=document.getElementById('header-placeholder');hP.innerHTML=hHTML;hP.querySelectorAll("script").forEach(o=>{const n=document.createElement("script");let t=o.text;if(t.includes("admin.html")){t=t.replace(/admin\.html/g,"admin/admin.html")}n.text=t;document.body.appendChild(n).parentNode.removeChild(n)});const aRes=await fetch('components/admin-auth.html'),aHTML=await aRes.text();let aP=document.getElementById('admin-auth-placeholder');if(!aP){aP=document.createElement('div');aP.id='admin-auth-placeholder';document.body.appendChild(aP)}aP.innerHTML=aHTML;aP.querySelectorAll("script").forEach(o=>{const n=document.createElement("script");n.text=o.text;document.body.appendChild(n).parentNode.removeChild(n)});const fRes=await fetch('components/footer.html');document.getElementById('footer-placeholder').innerHTML=await fRes.text();const bRes=await fetch('components/bgm.html'),bP=document.getElementById('bgm-placeholder');if(bP){bP.innerHTML=await bRes.text();bP.querySelectorAll("script").forEach(o=>{const n=document.createElement("script");n.text=o.text;document.body.appendChild(n).parentNode.removeChild(n)})}initMenuToggle()}catch(e){console.error("Layout load failed:",e)}}
function initMenuToggle(){const b=document.getElementById("menuToggleBtn"),d=document.getElementById("dropdownMenu"),i=document.getElementById("menuIcon");if(b&&d){b.onclick=(e)=>{e.stopPropagation();if(d.classList.contains("visible")){d.classList.remove("opacity-100","visible","translate-y-2");d.classList.add("opacity-0","invisible");if(i)i.innerText="☰"}else{d.classList.remove("opacity-0","invisible");d.classList.add("opacity-100","visible","translate-y-2");if(i)i.innerText="✕"}}}}
let currentIndex=0;const cards=document.querySelectorAll('.tech-card'),CARD_COUNT=cards.length;let isAnimating=false,autoTimer;const bgStars=document.getElementById('bg-stars'),starCount=150;for(let i=0;i<starCount;i++){const d=document.createElement('div');d.className='dot';d.style.left=`${Math.random()*100}%`;d.style.top=`${Math.random()*100}%`;d.style.transform=`translateZ(${Math.random()*500-250}px)`;bgStars.appendChild(d)}
function handleMouseMove(e){if(isAnimating)return;const c=cards[currentIndex],r=c.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,cX=r.width/2,cY=r.height/2,rtX=(cY-y)/20,rtY=(x-cX)/20;c.style.transform=`rotateX(${rtX}deg) rotateY(${rtY}deg)`;const mX=(e.clientX-window.innerWidth/2)/40,mY=(e.clientY-window.innerHeight/2)/40;bgStars.style.transform=`rotateY(${mX}deg) rotateX(${-mY}deg) translateZ(50px)`}
function handleMouseLeave(){cards[currentIndex].style.transform=`rotateX(0deg) rotateY(0deg)`;bgStars.style.transform=`rotateY(0deg) rotateX(0deg)`}
const messages=["TDL Energy Indonesia","Deliver the best products and services to our customers","Promote leadership consistently","Create and Innovate value"];
setInterval(()=>{const m=messages[Math.floor(Math.random()*messages.length)],e=document.getElementById('ai-msg');if(e)e.innerText=m},4000);
function update3DEvents(){cards.forEach((c,idx)=>{c.removeEventListener('mousemove',handleMouseMove);c.removeEventListener('mouseleave',handleMouseLeave);if(idx===currentIndex){c.addEventListener('mousemove',handleMouseMove);c.addEventListener('mouseleave',handleMouseLeave)}})}
function showCard(n,d){if(isAnimating)return;isAnimating=true;const o=currentIndex;currentIndex=n;const pC=cards[o],cC=cards[currentIndex];pC.style.transform='rotateX(0deg) rotateY(0deg)';const sD=document.getElementById('technologyContainer').offsetWidth;pC.style.zIndex='15';cC.style.zIndex='10';cC.style.opacity='1';cC.classList.add('is-active');requestAnimationFrame(()=>{pC.style.transition='transform 0.8s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.8s ease-out';pC.style.transform=d==='next'?`translateX(-${sD}px)`:`translateX(${sD}px)`;pC.style.opacity='0'});setTimeout(()=>{pC.classList.remove('is-active');pC.style.transform='translateX(0)';pC.style.transition='transform 0.1s ease-out, opacity 0.8s ease-out';isAnimating=false;update3DEvents()},800)}
const startAuto=()=>{stopAuto();autoTimer=setInterval(()=>showCard((currentIndex+1)%CARD_COUNT,'next'),5000)};
const stopAuto=()=>clearInterval(autoTimer);
document.getElementById('prevBtn').onclick=()=>{stopAuto();showCard((currentIndex-1+CARD_COUNT)%CARD_COUNT,'prev');startAuto()};
document.getElementById('nextBtn').onclick=()=>{stopAuto();showCard((currentIndex+1)%CARD_COUNT,'next');startAuto()};
cards.forEach(c=>{c.querySelectorAll('img').forEach(img=>{img.onclick=function(e){e.stopPropagation();stopAuto();const p=this.dataset.popupSrc||this.src,m=document.createElement('div');m.className='modal-backdrop';m.innerHTML=`<div class="modal-content custom-scrollbar"><span class="absolute top-5 right-6 text-3xl cursor-pointer opacity-50 hover:opacity-100" id="closeX">✕</span><img src="${p}" class="modal-image"><p class="mt-4 text-neutral-300 text-lg px-4">${this.dataset.detail||''}</p><button class="modal-close-btn">Close</button></div>`;const cl=()=>{if(m.parentNode)document.body.removeChild(m);startAuto()};m.querySelector('.modal-close-btn').onclick=cl;m.querySelector('#closeX').onclick=cl;m.onclick=(e)=>{if(e.target===m)cl()};document.body.appendChild(m)}})});
