<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <script>
        (function () {
            // 1. iPad를 제외하고 iPhone, Android 폰만 감지
            const isMobileOnly = /iPhone|iPod|Android/i.test(navigator.userAgent);

            const urlParams = new URLSearchParams(window.location.search);
            const isPCMode = urlParams.get('view_mode') === 'pc';

            // 2. 리다이렉트 실행
            if (isMobileOnly && !isPCMode) {
                let path = window.location.pathname;
                let page = path.split("/").pop();

                // 메인 페이지(index) 처리
                if (page === "" || page === "contact.html") {
                    window.location.href = "contact_m.html";
                }
                // 그 외 페이지들 (예: products.html -> products_m.html)
                else if (page.endsWith(".html") && !page.includes("_m.html")) {
                    window.location.href = page.replace(".html", "_m.html");
                }
            }
        })();
    </script>

    <title>Request Quote | TDL Energy Indonesia</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --accent: #00ffa3;
        }

        body {
            -webkit-user-select: auto;
            user-select: auto;
            background-color: #0a0a0c;
            perspective: 1000px; /* 3D 효과를 위한 깊이 설정 */
            overflow-x: hidden;
        }

        /* 3D 배경 입자 컨테이너 */
        .background-container {
            position: fixed;
            width: 150%;
            height: 150%;
            top: -25%;
            left: -25%;
            z-index: 0;
            transform-style: preserve-3d;
            pointer-events: none;
        }

        .dot {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            opacity: 0.3;
        }

        /* AI 개인화 태그 스타일 */
        .ai-badge {
            display: inline-block;
            padding: 6px 14px;
            border: 1px solid var(--accent);
            border-radius: 20px;
            font-size: 0.7rem;
            color: var(--accent);
            margin-bottom: 1.5rem;
            background: rgba(0, 255, 163, 0.05);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-family: monospace;
        }

        input,
        textarea,
        select {
            user-select: auto !important;
            -webkit-user-select: auto !important;
        }

        .contact-form-container {
            min-height: calc(100vh - 120px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding-top: 8rem;
            position: relative;
            z-index: 10;
            transition: transform 0.1s ease-out; /* 패럴랙스 부드러움 */
        }

        .form-card {
            max-width: 800px;
            width: 100%;
            margin-bottom: 5rem;
            backdrop-filter: blur(12px); /* 배경 입자와의 시각적 분리 */
            background: rgba(23, 23, 23, 0.8);
        }

        .stealth-link {
            cursor: text !important;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        #musicToggleBtn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 10005;
            width: 44px;
            height: 44px;
            background: rgba(23, 23, 23, 0.8);
            border: 1px solid rgba(34, 211, 238, 0.4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #22d3ee;
            backdrop-filter: blur(4px);
            transition: all 0.3s;
        }

        #musicToggleBtn:hover {
            transform: scale(1.1);
            border-color: #22d3ee;
        }

        .hero-slogan-gradient {
            display: inline-block !important;
            font-weight: 900 !important;
            line-height: 1.2 !important;
            padding-bottom: 0.1em;
            background: linear-gradient(to right, #0891b2 0%, #22d3ee 50%, #ffffff 100%) !important;
            -webkit-background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
            background-clip: text !important;
            color: transparent !important;
        }
    </style>
</head>

<body class="bg-neutral-950 text-neutral-100 font-[Pretendard] overflow-x-hidden">

    <div class="background-container" id="bg-stars"></div>

    <div id="bgm-placeholder"></div>
    <div id="header-placeholder"></div>

    <main class="px-6 contact-form-container" id="main-content">
        <div class="form-card border border-neutral-800 p-12 rounded-3xl shadow-2xl relative">
            
            <div class="ai-badge" id="ai-msg">System: Initializing Secure Uplink...</div>

            <h2 class="text-5xl font-black tracking-tight hero-slogan-gradient mb-4">
                Talk to us about your goals
            </h2>
            <p class="text-neutral-400 text-lg mb-10">
                <span>Complete the form below and discover how we can help</span>
                <span id="triggerOur" class="stealth-link">you</span>.
            </p>

            <form id="quoteForm" class="grid gap-6">
                <div class="grid grid-cols-2 gap-6">
                    <input name="company" placeholder="Company / Name"
                        class="p-5 rounded-2xl bg-neutral-800 border border-neutral-700 focus:border-cyan-500 outline-none transition"
                        required>
                    <input name="email" type="email" placeholder="Email Address"
                        class="p-5 rounded-2xl bg-neutral-800 border border-neutral-700 focus:border-cyan-500 outline-none transition"
                        required>
                </div>

                <div class="grid grid-cols-2 gap-6">
                    <input name="phone" placeholder="Phone / WhatsApp (Optional)"
                        class="p-5 rounded-2xl bg-neutral-800 border border-neutral-700 focus:border-cyan-500 outline-none transition">
                    <select name="product" id="quoteProductSelect"
                        class="p-5 rounded-2xl bg-neutral-800 border border-neutral-700 focus:border-cyan-500 outline-none transition text-neutral-400">
                        <option value="" class="text-neutral-400">-- Select Product / Service (Optional) --</option>
                        <option value="72V 20Ah Battery Pack">72V 20Ah Battery Pack</option>
                        <option value="EV Conversion Kit">EV Conversion Kit</option>
                        <option value="Solar Home Charging Solution">Solar Home Charging Solution</option>
                        <option value="Battery Recycling Program">Battery Recycling Program</option>
                        <option value="Other / General Inquiry">Other / General Inquiry</option>
                    </select>
                </div>

                <textarea name="details" rows="8"
                    placeholder="Project details, required quantity, use-case, delivery location, etc."
                    class="p-5 rounded-2xl bg-neutral-800 border border-neutral-700 focus:border-cyan-500 outline-none transition"></textarea>

                <button type="submit"
                    class="w-full mt-6 py-4 rounded-2xl bg-cyan-500 hover:bg-cyan-400 text-black text-xl font-bold transition shadow-lg shadow-cyan-500/20">
                    Submit Request
                </button>
            </form>

            <p id="formStatus" class="mt-6 text-center text-lg font-medium"></p>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <script>
        // --- 3D 및 AI 기능 추가 스크립트 ---
        
        // 1. 배경 입자 생성
        const bg = document.getElementById('bg-stars');
        const count = 150;
        for (let i = 0; i < count; i++) {
            const dot = document.createElement('div');
            dot.className = 'dot';
            const x = Math.random() * 100;
            const y = Math.random() * 100;
            const z = Math.random() * 500 - 250;
            dot.style.left = `${x}%`;
            dot.style.top = `${y}%`;
            dot.style.transform = `translateZ(${z}px)`;
            bg.appendChild(dot);
        }

        // 2. 마우스 패럴랙스 (Parallax) 효과
        const content = document.getElementById('main-content');
        document.body.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX - window.innerWidth / 2) / 40;
            const moveY = (e.clientY - window.innerHeight / 2) / 40;

            // 배경은 반대 방향으로 움직여 깊이감 생성
            bg.style.transform = `rotateY(${moveX * 0.5}deg) rotateX(${-moveY * 0.5}deg) translateZ(50px)`;
            
            // 폼 카드는 마우스를 미세하게 따라감
            content.style.transform = `rotateY(${moveX * 0.2}deg) rotateX(${-moveY * 0.2}deg)`;
        });

        // 3. AI 개인화 메시지 시뮬레이션
        const aiMessages = [
                "TDL Energy Indonesia",
                "Deliver the best products and services to our customers",
                "Promote leadership consistently",
                "Create and Innovate value"
        ];
        setInterval(() => {
            const msg = aiMessages[Math.floor(Math.random() * aiMessages.length)];
            const msgElement = document.getElementById('ai-msg');
            if(msgElement) msgElement.innerText = msg;
        }, 5500);


        // --- 기존 기능 유지 스크립트 ---

        const firebaseConfig = {
            apiKey: "AIzaSyDwF8_Q9S1-naaAgyfMWhFYJ2u_be3wsBs",
            authDomain: "tdlid-107669.firebaseapp.com",
            databaseURL: "https://tdlid-107669-default-rtdb.firebaseio.com",
            projectId: "tdlid-107669",
            storageBucket: "tdlid-107669.firebasestorage.app",
            messagingSenderId: "604782345004",
            appId: "1:604782345004:web:029aeaa81f4d11c2254a89"
        };

        let database;
        if (typeof firebase !== 'undefined') {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            database = firebase.database();
        }

        async function loadLayout() {
            try {
                const headerRes = await fetch('components/header.html');
                const headerHTML = await headerRes.text();
                const headerPlaceholder = document.getElementById('header-placeholder');
                headerPlaceholder.innerHTML = headerHTML;

                const headerScripts = headerPlaceholder.querySelectorAll("script");
                headerScripts.forEach(oldScript => {
                    if (oldScript.src) return;
                    const newScript = document.createElement("script");
                    let scriptText = oldScript.text;
                    if (scriptText.includes("admin.html")) {
                        scriptText = scriptText.replace(/admin\.html/g, "admin/admin.html");
                    }
                    newScript.text = scriptText;
                    document.body.appendChild(newScript).parentNode.removeChild(newScript);
                });

                const authRes = await fetch('components/admin-auth.html');
                const authHTML = await authRes.text();
                let authDiv = document.getElementById('admin-auth-placeholder');
                if (!authDiv) {
                    authDiv = document.createElement('div');
                    authDiv.id = 'admin-auth-placeholder';
                    document.body.appendChild(authDiv);
                }
                authDiv.innerHTML = authHTML;

                const authScripts = authDiv.querySelectorAll("script");
                authScripts.forEach(oldScript => {
                    const newScript = document.createElement("script");
                    if (oldScript.src) newScript.src = oldScript.src;
                    else newScript.text = oldScript.text;
                    document.body.appendChild(newScript).parentNode.removeChild(newScript);
                });

                const footerRes = await fetch('components/footer.html');
                const footerPlaceholder = document.getElementById('footer-placeholder');
                footerPlaceholder.innerHTML = await footerRes.text();
                const footerScripts = footerPlaceholder.querySelectorAll("script");
                footerScripts.forEach(oldScript => {
                    const newScript = document.createElement("script");
                    newScript.text = oldScript.text;
                    document.body.appendChild(newScript).parentNode.removeChild(newScript);
                });

                const bgmRes = await fetch('components/bgm.html');
                const bgmPlaceholder = document.getElementById('bgm-placeholder');
                if (bgmPlaceholder) {
                    bgmPlaceholder.innerHTML = await bgmRes.text();
                    const bgmScripts = bgmPlaceholder.querySelectorAll("script");
                    bgmScripts.forEach(oldScript => {
                        if (oldScript.src) return;
                        const newScript = document.createElement("script");
                        newScript.text = oldScript.text;
                        document.body.appendChild(newScript).parentNode.removeChild(newScript);
                    });
                }

                initMenuToggle();
                initFormHandler();
                initEeggTrigger();

            } catch (err) {
                console.error("Layout load failed:", err);
            }
        }

        function initEeggTrigger() {
            const trigger = document.getElementById('triggerOur');
            if (trigger) {
                trigger.onclick = () => { window.location.href = 'e-egg.html'; };
            }
        }

        function initMenuToggle() {
            const menuBtn = document.getElementById("menuToggleBtn");
            const dropdown = document.getElementById("dropdownMenu");
            const menuIcon = document.getElementById("menuIcon");
            if (menuBtn && dropdown) {
                menuBtn.onclick = (e) => {
                    e.stopPropagation();
                    const isOpen = dropdown.classList.contains("opacity-100");
                    if (!isOpen) {
                        dropdown.classList.remove("opacity-0", "invisible", "translate-y-[-10px]");
                        dropdown.classList.add("opacity-100", "visible", "translate-y-2");
                        if (menuIcon) menuIcon.innerText = "✕";
                    } else {
                        closeMenu();
                    }
                };
                function closeMenu() {
                    dropdown.classList.remove("opacity-100", "visible", "translate-y-2");
                    dropdown.classList.add("opacity-0", "invisible", "translate-y-[-10px]");
                    if (menuIcon) menuIcon.innerText = "☰";
                }
                document.addEventListener("click", (e) => {
                    if (!dropdown.contains(e.target) && !menuBtn.contains(e.target)) closeMenu();
                });
            }
        }

        function initFormHandler() {
            const form = document.getElementById('quoteForm');
            const formStatus = document.getElementById('formStatus');

            if (form) {
                form.onsubmit = async (e) => {
                    e.preventDefault();
                    const submitBtn = form.querySelector('button[type="submit"]');
                    submitBtn.disabled = true;
                    submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
                    formStatus.textContent = "Storing Request...";
                    formStatus.className = 'mt-6 text-center text-lg text-cyan-400 animate-pulse';

                    try {
                        const formData = new FormData(form);
                        const msgData = {
                            timestamp: Date.now(),
                            date: new Date().toLocaleString(),
                            company: formData.get('company'),
                            email: formData.get('email'),
                            phone: formData.get('phone') || 'N/A',
                            product: formData.get('product') || 'None Selected',
                            details: formData.get('details') || '',
                            read: false,
                            status: 'new'
                        };
                        const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject(new Error('Timeout')), 10000));
                        await Promise.race([database.ref('messages').push(msgData), timeoutPromise]);
                        formStatus.innerHTML = `✅ Submitted successfully!<br><span class="text-sm font-normal">We will get back to you shortly.</span>`;
                        formStatus.className = 'mt-6 text-center text-lg text-green-500 font-bold';
                        form.reset();
                    } catch (error) {
                        console.error("Submission Error:", error);
                        formStatus.innerHTML = "❌ Error saving data.";
                        formStatus.className = 'mt-6 text-center text-lg text-red-500 leading-relaxed';
                    } finally {
                        submitBtn.disabled = false;
                        submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                    }
                };
            }
        }

        document.addEventListener("DOMContentLoaded", loadLayout);
    </script>

</body>
</html>
