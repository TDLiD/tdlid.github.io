name: Daily Indonesia News Update

on:
  schedule:
    - cron: '0 1 * * *' # 한국 시간 매일 오전 10시 실행
  workflow_dispatch: # 직접 버튼을 눌러 실행 가능하게 함

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm install
      - name: Run Script
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: node update_news.js
