    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDwF8_Q9S1-naaAgyfMWhFYJ2u_be3wsBs",
            authDomain: "tdlid-107669.firebaseapp.com",
            databaseURL: "https://tdlid-107669-default-rtdb.firebaseio.com",
            projectId: "tdlid-107669",
            storageBucket: "tdlid-107669.firebasestorage.app",
            messagingSenderId: "604782345004",
            appId: "1:604782345004:web:029aeaa81f4d11c2254a89"
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const database = firebase.database();

        function initLiveSettings() {
            database.ref('siteSettings/seo').on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    if (data.description) document.getElementById('metaDescription').content = data.description;
                    if (data.keywords) document.getElementById('metaKeywords').content = data.keywords;
                }
            });
            database.ref('siteSettings/popups').on('value', (snapshot) => {
                const popups = snapshot.val();
                const popup = document.getElementById('mainPopup');
                const popupBox = popup.querySelector('.popup-box');
                const popupText = document.getElementById('popupText');
                let isAnyPopupVisible = false;
                if (popups && Array.isArray(popups)) {
                    const now = new Date().toISOString().split('T')[0];
                    popups.forEach(item => {
                        if (item && item.popupActive && !isAnyPopupVisible) {
                            const isDateValid = (!item.startDate || now >= item.startDate) && (!item.endDate || now <= item.endDate);
                            if (isDateValid) {
                                popupBox.className = "popup-box";
                                const effectClass = `effect-${item.effect || 'classic'}`;
                                popupBox.classList.add(effectClass);
                                popup.style.display = 'flex';
                                popupText.innerHTML = item.content || item.text || '';
                                isAnyPopupVisible = true;
                                if (item.effect && item.effect !== 'classic') {
                                    setTimeout(() => {
                                        popupBox.classList.add('popup-exit-active');
                                        setTimeout(() => {
                                            closeMainPopup();
                                            popupBox.classList.remove('popup-exit-active');
                                        }, 500);
                                    }, 3000);
                                }
                                if (item.effect === 'heart' && typeof activateHeartEasterEgg === 'function') {
                                    activateHeartEasterEgg();
                                }
                            }
                        }
                    });
                }
                if (!isAnyPopupVisible) closeMainPopup();
            });
        }
        function closeMainPopup() {
            const popup = document.getElementById('mainPopup');
            popup.style.display = 'none';
            document.body.classList.remove('overflow-hidden');
        }
        function openAdminAuth() {
            const modal = document.getElementById('adminAuthModal');
            modal.classList.remove('hidden');
            document.getElementById('adminPasswordInput').focus();
            document.body.style.overflow = 'hidden';
        }
        function closeAdminAuth() {
            const modal = document.getElementById('adminAuthModal');
            modal.classList.add('hidden');
            document.getElementById('adminPasswordInput').value = '';
            document.body.style.overflow = '';
        }
        async function verifyAdminPassword() {
            const inputPw = document.getElementById('adminPasswordInput').value;
            if (inputPw.length > 0) {
                sessionStorage.setItem('admin_pre_auth', 'true');
                window.location.href = "admin/login.html";
            } else {
                alert("Please enter password.");
            }
        }
        async function recordVisit() {
            try {
                let geoData = { ip: "0.0.0.0", country: "Unknown", city: "Unknown" };
                try {
                    const response = await fetch('https://ipapi.co/json/');
                    const data = await response.json();
                    geoData = { ip: data.ip, country: data.country_name, city: data.city };
                } catch (e) { console.error("Geo API Error:", e); }
                const ua = navigator.userAgent;
                const now = new Date();
                const visitData = {
                    timestamp: now.getTime(),
                    timeStr: now.toLocaleString(),
                    page: window.location.pathname.split('/').pop() || 'index_m.html',
                    ip: geoData.ip,
                    country: geoData.country,
                    city: geoData.city,
                    device: "Mobile",
                    os: getOS(ua),
                    browser: getBrowser(ua),
                    sid: getSessionId(),
                    referrer: document.referrer || "Direct"
                };
                database.ref('visits').push(visitData);
            } catch (e) { console.error("History error:", e); }
        }
        function getOS(ua) {
            if (ua.indexOf("Windows") !== -1) return "Windows";
            if (ua.indexOf("Mac") !== -1) return "macOS";
            if (ua.indexOf("Android") !== -1) return "Android";
            if (ua.indexOf("iPhone") !== -1 || ua.indexOf("iPad") !== -1) return "iOS";
            return "Unknown";
        }
        function getBrowser(ua) {
            if (ua.indexOf("Edge") !== -1 || ua.indexOf("Edg") !== -1) return "Edge";
            if (ua.indexOf("Chrome") !== -1) return "Chrome";
            if (ua.indexOf("Safari") !== -1) return "Safari";
            if (ua.indexOf("Firefox") !== -1) return "Firefox";
            return "Others";
        }
        function getSessionId() {
            if (!sessionStorage.getItem('session_id')) {
                sessionStorage.setItem('session_id', 's_' + Math.random().toString(36).substr(2, 9));
            }
            return sessionStorage.getItem('session_id');
        }
        recordVisit();
    </script>

    <script>
        // Redirect logic 유지
        const isMobileOnly = /iPhone|iPod|Android/i.test(navigator.userAgent);
        const urlParams = new URLSearchParams(window.location.search);
        const isPCMode = urlParams.get('view_mode') === 'pc';
        if (!isMobileOnly || isPCMode) {
            let path = window.location.pathname;
            let page = path.split("/").pop();
            if (page.includes("_m.html")) { window.location.href = page.replace("_m.html", ".html"); }
            else if (page === "index_m.html" || page === "") { window.location.href = "index.html"; }
        }

        // --- Resn Cursor Logic ---
        const dot = document.querySelector('.cursor-dot');
        const circle = document.querySelector('.cursor-circle');
        let mouseX = 0, mouseY = 0;
        let circleX = 0, circleY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            dot.style.left = mouseX + 'px';
            dot.style.top = mouseY + 'px';
        });

        function animateCircle() {
            circleX += (mouseX - circleX) * 0.15;
            circleY += (mouseY - circleY) * 0.15;
            circle.style.left = circleX + 'px';
            circle.style.top = circleY + 'px';
            requestAnimationFrame(animateCircle);
        }
        animateCircle();

        // Hover Effect for Cursor
        document.addEventListener('mouseover', (e) => {
            if (e.target.tagName === 'A' || e.target.tagName === 'BUTTON' || e.target.closest('#triggerWord') || e.target.closest('#pillarTrigger')) {
                circle.classList.add('hover');
            }
        });
        document.addEventListener('mouseout', (e) => {
            if (e.target.tagName === 'A' || e.target.tagName === 'BUTTON' || e.target.closest('#triggerWord') || e.target.closest('#pillarTrigger')) {
                circle.classList.remove('hover');
            }
        });

        // --- Fluid Canvas Interaction Logic ---
        const canvas = document.getElementById('fluidCanvas');
        const ctx = canvas.getContext('2d');
        let points = [];
        const maxDist = 150;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initPoints();
        }

        function initPoints() {
            points = [];
            const count = Math.floor((canvas.width * canvas.height) / 15000);
            for (let i = 0; i < count; i++) {
                points.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    ox: 0, oy: 0,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5
                });
                points[i].ox = points[i].x;
                points[i].oy = points[i].y;
            }
        }

        function drawFluid() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = 'rgba(34, 211, 238, 0.15)';
            ctx.fillStyle = 'rgba(34, 211, 238, 0.3)';

            points.forEach((p, i) => {
                p.x += p.vx;
                p.y += p.vy;
                if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

                const dx = mouseX - p.x;
                const dy = mouseY - p.y;
                const dist = Math.sqrt(dx*dx + dy*dy);

                if (dist < 200) {
                    const angle = Math.atan2(dy, dx);
                    const force = (200 - dist) / 200;
                    p.x -= Math.cos(angle) * force * 2;
                    p.y -= Math.sin(angle) * force * 2;
                }

                ctx.beginPath();
                ctx.arc(p.x, p.y, 1.5, 0, Math.PI * 2);
                ctx.fill();

                for (let j = i + 1; j < points.length; j++) {
                    const p2 = points[j];
                    const d2 = Math.sqrt(Math.pow(p.x - p2.x, 2) + Math.pow(p.y - p2.y, 2));
                    if (d2 < 120) {
                        ctx.lineWidth = (120 - d2) / 120;
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                    }
                }
            });
            requestAnimationFrame(drawFluid);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        drawFluid();

        // --- 기존 로드 로직 유지 ---
        async function loadLayout() {
            try {
                const [headerRes, footerRes] = await Promise.all([fetch('components/header_m.html'), fetch('components/footer_m.html')]);
                const headerText = await headerRes.text();
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = headerText;
                const adminLink = tempDiv.querySelector('a[href="admin/admin.html"]');
                if (adminLink) adminLink.remove();
                document.getElementById('header-placeholder').innerHTML = tempDiv.innerHTML;
                
                const footerPlaceholder = document.getElementById('footer-placeholder');
                footerPlaceholder.innerHTML = await footerRes.text();
                const scripts = footerPlaceholder.querySelectorAll("script");
                scripts.forEach(oldScript => {
                    const newScript = document.createElement("script");
                    newScript.text = oldScript.text;
                    document.body.appendChild(newScript).parentNode.removeChild(newScript);
                });
                initNavigation(); initAdminTrigger(); initCertModal(); initLiveSettings();
            } catch (err) { console.error("Layout Load Error:", err); }
        }

        function initNavigation() {
            const menuBtn = document.getElementById("menuToggleBtn");
            const dropdown = document.getElementById("dropdownMenu");
            const menuIcon = document.getElementById("menuIcon");
            if (menuBtn && dropdown) {
                menuBtn.onclick = (e) => {
                    e.stopPropagation();
                    const isHidden = dropdown.classList.contains("invisible");
                    if (isHidden) {
                        dropdown.classList.remove("opacity-0", "invisible");
                        dropdown.classList.add("opacity-100", "visible", "translate-y-2");
                        if (menuIcon) menuIcon.innerText = "✕";
                    } else {
                        dropdown.classList.remove("opacity-100", "visible", "translate-y-2");
                        dropdown.classList.add("opacity-0", "invisible");
                        if (menuIcon) menuIcon.innerText = "☰";
                    }
                };
            }
        }

        function initAdminTrigger() {
            const triggerWord = document.getElementById('triggerWord');
            if (triggerWord) { triggerWord.addEventListener('click', (e) => { e.preventDefault(); openAdminAuth(); }); }
        }
        document.getElementById('adminPasswordInput')?.addEventListener('keypress', (e) => { if (e.key === 'Enter') verifyAdminPassword(); });

        function initCertModal() {
            document.querySelectorAll('.cert-link').forEach(link => {
                link.onclick = (e) => {
                    e.preventDefault();
                    const modal = document.getElementById('imageModal');
                    const modalImg = document.getElementById('modalDetailImage');
                    modalImg.src = link.getAttribute('data-original-src');
                    modal.style.display = 'block';
                    document.body.style.overflow = 'hidden';
                };
            });
        }

        function closeModal() {
            const modal = document.getElementById('imageModal');
            modal.style.display = 'none';
            document.body.style.overflow = '';
        }

        function initImageSlider() {
            const sliderContainer = document.getElementById('heroSlider');
            if (!sliderContainer) return;
            const totalImages = 25;
            const images = [];
            for (let i = 1; i <= totalImages; i++) { images.push(`images/bg/bg-3.gif`); }
            images.forEach((src, idx) => {
                const img = document.createElement('img');
                img.src = src;
                img.className = 'slide' + (idx === 0 ? ' active' : '');
                sliderContainer.appendChild(img);
            });
            const slides = sliderContainer.querySelectorAll('.slide');
            let currentIdx = 0;
            function waveTransition() {
                const prevSlide = slides[currentIdx];
                currentIdx = (currentIdx + 1) % slides.length;
                const nextSlide = slides[currentIdx];
                prevSlide.classList.add('exit');
                prevSlide.classList.remove('active');
                nextSlide.classList.add('active');
                setTimeout(() => { prevSlide.classList.remove('exit'); }, 2000);
            }
            setInterval(waveTransition, 4000);
        }

        let isHeartActive = false;
        function initPillarEgg() {
            const pillar = document.getElementById('pillarTrigger');
            if (pillar) { pillar.addEventListener('click', () => { if (isHeartActive) return; activateHeartEasterEgg(); }); }
        }

        function activateHeartEasterEgg() {
            isHeartActive = true;
            if (navigator.vibrate) navigator.vibrate([50, 30, 50]);
            createHeartFormation();
            setTimeout(() => { isHeartActive = false; }, 6000);
        }

        function createHeartFormation() {
            const heartCount = 60;
            const container = document.body;
            const hearts = [];
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            for (let i = 0; i < heartCount; i++) {
                const heart = document.createElement('div');
                heart.innerHTML = '❤️';
                heart.style.cssText = `position: fixed; left: ${Math.random() * 100}vw; top: -10vh; font-size: ${Math.random() * 10 + 15}px; z-index: 999999; pointer-events: none; transition: all 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);`;
                container.appendChild(heart);
                hearts.push(heart);
                setTimeout(() => { heart.style.top = (Math.random() * 80 + 10) + 'vh'; }, 100);
            }
            setTimeout(() => {
                hearts.forEach((heart, idx) => {
                    const t = (idx / heartCount) * 2 * Math.PI;
                    const scale = Math.min(window.innerWidth, window.innerHeight) / 25;
                    const x = 16 * Math.pow(Math.sin(t), 3);
                    const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
                    heart.style.transition = "all 2s ease-in-out";
                    heart.style.left = (centerX + x * scale) + 'px';
                    heart.style.top = (centerY + y * scale) + 'px';
                    heart.style.transform = `scale(1.5) rotate(${(Math.random() - 0.5) * 20}deg)`;
                });
            }, 1800);
            setTimeout(() => {
                hearts.forEach(heart => {
                    heart.style.transition = "all 1.5s ease-in";
                    heart.style.opacity = '0';
                    heart.style.transform = `translate(${(Math.random() - 0.5) * 300}px, -100px) scale(0)`;
                    setTimeout(() => heart.remove(), 1500);
                });
            }, 4500);
        }

        document.addEventListener("DOMContentLoaded", () => {
            loadLayout().then(() => { initPillarEgg(); });
            initImageSlider();
        });
