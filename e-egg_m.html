<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TDLiD Secure Terminal // M</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* ===============================
            GLOBAL & MOBILE RESET
        ================================ */
        body {
            background-color: #000;
            margin: 0;
            overflow-x: hidden;
            overflow-y: auto;
            /* 내용이 많아지면 스크롤 허용 */
            color: #22d3ee;
            font-family: 'Courier New', monospace;
            -webkit-tap-highlight-color: transparent;
        }

        /* 터치 추적 레이저 레이어 */
        #laser-guide {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }

        .cyber-bg {
            position: fixed;
            inset: 0;
            background:
                linear-gradient(rgba(34, 211, 238, .07) 1px, transparent 1px),
                linear-gradient(90deg, rgba(34, 211, 238, .07) 1px, transparent 1px);
            background-size: 30px 30px;
            animation: gridMove 4s linear infinite;
            z-index: 1;
        }

        @keyframes gridMove {
            from {
                background-position: 0 0;
            }

            to {
                background-position: 30px 30px;
            }
        }

        /* 스크린 글리치 (긴장감 조성) */
        .glitch-heavy {
            animation: shake 0.1s infinite !important;
            background: rgba(255, 0, 0, 0.1) !important;
        }

        @keyframes shake {
            0% {
                transform: translate(0, 0);
            }

            10% {
                transform: translate(-2px, 1px);
            }

            100% {
                transform: translate(2px, -1px);
            }
        }

        /* 반전 테마 */
        .success-theme {
            background: radial-gradient(circle at center, #0e7490 0%, #000 100%) !important;
            transition: all 2s ease;
        }

        /* ===============================
            STAFF IMAGES (모바일 최적화)
        ================================ */
        .staff-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
            width: 100%;
            z-index: 20;
        }

        .staff-img {
            width: calc(50% - 15px);
            /* 모바일 2열 배치 */
            max-width: 160px;
            height: auto;
            border: 1px solid #22d3ee;
            filter: grayscale(1) brightness(0.5);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.8s cubic-bezier(.2, 1, .3, 1);
        }

        .staff-img.reveal {
            opacity: 1;
            transform: none;
            filter: grayscale(0) brightness(1);
        }

        .pulse {
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.03);
            }

            100% {
                transform: scale(1);
            }
        }

        /* 하단 데이터 장식 */
        .bottom-info {
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 20px 0;
            font-size: 10px;
            opacity: 0.4;
        }
    </style>
</head>

<body>
    <canvas id="laser-guide"></canvas>
    <div id="bg-layer" class="fixed inset-0 z-0 bg-black transition-all duration-1000"></div>
    <div id="glitch-overlay" class="fixed inset-0 z-10 pointer-events-none"></div>
    <div class="cyber-bg"></div>

    <div id="sys-msg" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 text-red-500 font-bold text-[10px] hidden">
        [!] SYSTEM OVERRIDE: TARGET_LOCATED
    </div>

    <div class="relative z-20 min-h-screen flex flex-col items-center justify-start pt-12 pb-20 px-6">
        <div id="main-frame" class="border border-cyan-500 bg-cyan-950/40 px-6 py-4 mb-6 backdrop-blur-sm text-center">
            <h1 id="title" class="text-lg font-black tracking-tighter transition-all">
                SCANNING FOR INTRUDERS...
            </h1>
        </div>

        <div id="statusLog" class="text-cyan-400 mb-8 text-center text-sm font-bold h-6">
            CONNECTING...
        </div>

        <div class="staff-container" id="staff-box">
            <img class="staff-img" src="images/easter_egg/staff1.webp" alt="RAY">
            <img class="staff-img" src="images/easter_egg/staff2.webp" alt="EZA">
            <img class="staff-img" src="images/easter_egg/staff3.webp" alt="REZY">
            <img class="staff-img" src="images/easter_egg/staff4.webp" alt="ETNO">
            <img class="staff-img" src="images/easter_egg/staff5.webp" alt="STAFF5">
            <img class="staff-img" src="images/easter_egg/staff6.webp" alt="STAFF6">
        </div>

        <button id="final-btn"
            class="mt-10 px-8 py-4 bg-red-600 text-white font-black text-sm opacity-0 transition-all duration-1000">
            ABORT SYSTEM
        </button>

        <div class="bottom-info">
            <div>CORE: 31.8C<br>BMS: OVERRIDE</div>
            <div class="text-right">ENC: v4.0.2<br>LEVEL: █████</div>
        </div>
    </div>

    <div id="alex-popup"
        class="fixed inset-0 z-[100] flex items-center justify-center bg-black/90 opacity-0 pointer-events-none transition-opacity duration-500">
        <img src="images/easter_egg/alex.png" class="max-w-[85%] max-h-[70%] border-2 border-white">
    </div>

    <script>
        /* 1. 터치 반응 레이저 구현 */
        const canvas = document.getElementById('laser-guide');
        const ctx = canvas.getContext('2d');
        let touchPos = { x: -100, y: -100 };

        const updateTouch = (e) => {
            const touch = e.touches[0];
            touchPos.x = touch.clientX;
            touchPos.y = touch.clientY;
        };
        window.addEventListener('touchstart', updateTouch);
        window.addEventListener('touchmove', updateTouch);

        function drawLaser() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = 'rgba(34, 211, 238, 0.25)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(touchPos.x, 0); ctx.lineTo(touchPos.x, canvas.height);
            ctx.moveTo(0, touchPos.y); ctx.lineTo(canvas.width, touchPos.y);
            ctx.stroke();
            requestAnimationFrame(drawLaser);
        }
        drawLaser();

        /* 2. 시나리오 로직 */
        const log = document.getElementById('statusLog');
        const title = document.getElementById('title');
        const glitch = document.getElementById('glitch-overlay');
        const sysMsg = document.getElementById('sys-msg');

        const script = [
            { txt: "> TRACING SIGNAL...", time: 1000 },
            { txt: "> [!] INTRUDER DETECTED", time: 600, alert: true },
            { txt: "> ACCESSING PHONE DATA...", time: 1000, heavyGlitch: true },
            { txt: "> SELF-DESTRUCT IN 3...", time: 800 },
            { txt: "WAIT... USER RECOGNIZED", time: 1500, stopGlitch: true }
        ];

        let step = 0;
        function runScenario() {
            if (step < script.length) {
                const item = script[step];
                log.innerText = item.txt;
                if (item.alert) { sysMsg.classList.remove('hidden'); title.style.color = 'red'; }
                if (item.heavyGlitch) glitch.classList.add('glitch-heavy');
                if (item.stopGlitch) { glitch.classList.remove('glitch-heavy'); title.style.color = '#22d3ee'; }
                step++;
                setTimeout(runScenario, item.time);
            } else {
                triggerHappyEnding();
            }
        }

        function triggerHappyEnding() {
            title.innerText = "WELCOME!";
            log.innerText = "WE'VE BEEN WAITING FOR YOU";
            document.getElementById('bg-layer').classList.add('success-theme');

            const imgs = document.querySelectorAll(".staff-img");
            imgs.forEach((img, idx) => {
                setTimeout(() => { img.classList.add("reveal", "pulse"); }, idx * 250);
            });

            const btn = document.getElementById('final-btn');
            btn.innerText = "RETURN TO HOME";
            btn.style.opacity = "1";
            btn.classList.replace('bg-red-600', 'bg-cyan-500');
            btn.onclick = () => location.href = 'index_m.html';

            // 버튼 위치로 자동 스크롤
            setTimeout(() => { btn.scrollIntoView({ behavior: 'smooth' }); }, 2000);

            // Alex 팝업 이벤트
            const staff6 = document.querySelector('img[alt="STAFF6"]');
            const alexPopup = document.getElementById('alex-popup');
            if (staff6) {
                staff6.addEventListener('touchstart', () => {
                    alexPopup.classList.remove('opacity-0', 'pointer-events-none');
                    alexPopup.classList.add('opacity-100');
                    setTimeout(() => {
                        alexPopup.classList.replace('opacity-100', 'opacity-0');
                        alexPopup.classList.add('pointer-events-none');
                    }, 3000);
                });
            }
        }

        setTimeout(runScenario, 1000);
    </script>
</body>

</html>
