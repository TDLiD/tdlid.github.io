<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TDLiD Admin - Internal Memo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #020617; font-family: 'Pretendard', sans-serif; color: #e5e7eb; }
        .tab-item { transition: all 0.3s ease; position: relative; }
        .tab-item.active { color: #22d3ee; }
        .tab-item.active::after {
            content: ''; position: absolute; bottom: -25px; left: 0; width: 100%; height: 2px;
            background: #22d3ee; box-shadow: 0 0 10px #22d3ee;
        }
        #authOverlay, #memoModal { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; }
        #authOverlay { background: #020617; }
        #memoModal { background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); display: none; }
        .memo-list-item { transition: all 0.2s; border-left: 2px solid transparent; }
        .memo-list-item:hover { background: rgba(34, 211, 238, 0.05); border-left-color: #22d3ee; padding-left: 1.5rem; }
    </style>
</head>
<body class="p-8">
    <div id="authOverlay">
        <p class="text-cyan-400 font-bold tracking-widest animate-pulse">CHECKING AUTHORITY...</p>
    </div>

    <div id="memoModal" onclick="closeModal(event)">
        <div class="bg-neutral-900 w-full max-w-2xl p-8 rounded-3xl border border-white/10 shadow-2xl m-4" onclick="event.stopPropagation()">
            <div class="flex justify-between items-start mb-6">
                <div>
                    <h2 id="modalTitleDisplay" class="text-2xl font-bold text-white mb-1">제목</h2>
                    <p id="modalDateDisplay" class="text-[10px] text-neutral-500 font-mono uppercase tracking-widest">날짜 표시</p>
                </div>
                <button onclick="closeModal()" class="text-neutral-500 hover:text-white transition">✕</button>
            </div>
            
            <div id="viewMode">
                <div id="modalContentDisplay" class="bg-black/30 p-6 rounded-2xl text-neutral-300 text-sm leading-relaxed whitespace-pre-wrap min-h-[200px] mb-8 border border-white/5">내용</div>
                <div class="flex gap-3 justify-end">
                    <button onclick="switchEditMode()" class="px-6 py-2 bg-amber-600/20 text-amber-500 text-[11px] font-bold rounded-full hover:bg-amber-600 hover:text-white transition uppercase">Edit</button>
                    <button onclick="handleDelete()" class="px-6 py-2 bg-red-600/20 text-red-500 text-[11px] font-bold rounded-full hover:bg-red-600 hover:text-white transition uppercase">Delete</button>
                </div>
            </div>

            <div id="editMode" class="hidden space-y-4">
                <input type="text" id="editTitle" class="w-full bg-black border border-neutral-800 rounded-xl p-4 text-sm text-white focus:border-amber-500 outline-none transition" placeholder="Title">
                <textarea id="editContent" class="w-full bg-black border border-neutral-800 rounded-xl p-4 text-sm text-neutral-300 focus:border-amber-500 outline-none transition h-48" placeholder="Content"></textarea>
                <div class="flex gap-3 justify-end">
                    <button onclick="switchViewMode()" class="px-6 py-2 text-neutral-500 text-[11px] font-bold uppercase">Cancel</button>
                    <button onclick="updateMemo()" class="px-6 py-2 bg-amber-600 text-white text-[11px] font-bold rounded-full shadow-lg shadow-amber-900/20 uppercase">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <div class="max-w-6xl mx-auto">
        <header class="mb-12 border-b border-cyan-900/50 pb-6 flex flex-col md:flex-row md:items-end justify-between gap-6">
            <div>
                <h1 class="text-4xl font-bold text-cyan-400 tracking-tighter italic">ADMIN SYSTEM</h1>
                <p class="text-neutral-500 text-sm mt-1 uppercase tracking-widest">Internal Memo Pad</p>
            </div>
            <nav class="flex gap-8 text-sm font-bold uppercase tracking-wider text-neutral-500">
                <a href="admin.html" class="tab-item hover:text-white transition">Dashboard</a>
                <a href="visitor.html" class="tab-item hover:text-white transition">Visitor</a>
                <a href="inquiry.html" class="tab-item hover:text-white transition">Inquiry</a>
                <a href="post.html" class="tab-item hover:text-white transition">Posts</a>
                <a href="memo.html" class="tab-item active hover:text-white transition">Memo</a>
                <a href="security.html" class="tab-item hover:text-white transition">Security</a>
            </nav>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-12">
            <div class="lg:col-span-1">
                <div class="bg-neutral-900/80 p-8 rounded-3xl border border-white/5 sticky top-8">
                    <h3 class="text-xl font-bold text-white mb-8 flex items-center gap-2">
                        <span class="text-emerald-500">➕</span> Create New
                    </h3>
                    <div class="space-y-4">
                        <input type="text" id="newTitle" class="w-full bg-black border border-neutral-800 rounded-xl p-4 text-sm text-white focus:border-emerald-500 outline-none transition" placeholder="Memo Title">
                        <textarea id="newContent" class="w-full bg-black border border-neutral-800 rounded-xl p-4 text-sm text-neutral-300 focus:border-emerald-500 outline-none transition h-40" placeholder="Type your content..."></textarea>
                        <button onclick="saveNewMemo()" class="w-full py-4 bg-emerald-600/20 hover:bg-emerald-600 text-emerald-400 hover:text-white font-bold rounded-xl transition uppercase tracking-widest text-xs">Add Memo</button>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-2">
                <h3 class="text-sm font-bold text-neutral-500 uppercase tracking-[0.2em] mb-6">Archive List</h3>
                <div class="space-y-1" id="memoList">
                    <p class="text-neutral-600 animate-pulse">Loading archive...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDwF8_Q9S1-naaAgyfMWhFYJ2u_be3wsBs",
            authDomain: "tdlid-107669.firebaseapp.com",
            databaseURL: "https://tdlid-107669-default-rtdb.firebaseio.com",
            projectId: "tdlid-107669",
            storageBucket: "tdlid-107669.firebasestorage.app",
            messagingSenderId: "604782345004",
            appId: "1:604782345004:web:029aeaa81f4d11c2254a89"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const auth = firebase.auth();

        let currentMemoKey = null;
        let memosData = {};

        auth.onAuthStateChanged((user) => {
            if (user) {
                document.getElementById('authOverlay').style.display = 'none';
                loadMemos();
            } else {
                window.location.href = "login.html";
            }
        });

        async function saveNewMemo() {
            const title = document.getElementById('newTitle').value;
            const content = document.getElementById('newContent').value;
            if(!title.trim()) { alert("Please enter a title."); return; }

            try {
                await database.ref('adminMemos').push({
                    title: title,
                    content: content,
                    timestamp: Date.now(),
                    dateText: new Date().toLocaleString()
                });
                document.getElementById('newTitle').value = '';
                document.getElementById('newContent').value = '';
            } catch (e) { alert(e.message); }
        }

        function loadMemos() {
            database.ref('adminMemos').on('value', (snapshot) => {
                const memoList = document.getElementById('memoList');
                memoList.innerHTML = '';
                
                if (!snapshot.exists()) {
                    memoList.innerHTML = '<p class="text-neutral-600 italic py-8">No archive found.</p>';
                    return;
                }

                memosData = snapshot.val();
                const keys = Object.keys(memosData).reverse();

                keys.forEach(key => {
                    const memo = memosData[key];
                    const div = document.createElement('div');
                    div.className = 'memo-list-item bg-neutral-900/40 p-5 rounded-xl cursor-pointer flex justify-between items-center group';
                    div.onclick = () => openModal(key);
                    div.innerHTML = `
                        <span class="text-neutral-200 font-semibold group-hover:text-cyan-400 transition">${memo.title}</span>
                        <span class="text-[10px] text-neutral-600 font-mono">${memo.dateText.split(',')[0]}</span>
                    `;
                    memoList.appendChild(div);
                });
            });
        }

        function openModal(key) {
            currentMemoKey = key;
            const memo = memosData[key];
            
            document.getElementById('modalTitleDisplay').innerText = memo.title;
            document.getElementById('modalContentDisplay').innerText = memo.content || '(No content)';
            document.getElementById('modalDateDisplay').innerText = memo.dateText + (memo.lastModified ? ' (Edited)' : '');
            
            // 수정용 필드 채우기
            document.getElementById('editTitle').value = memo.title;
            document.getElementById('editContent').value = memo.content;

            document.getElementById('memoModal').style.display = 'flex';
            switchViewMode();
        }

        function closeModal(e) {
            if(!e || e.target.id === 'memoModal' || e.type === 'click') {
                document.getElementById('memoModal').style.display = 'none';
            }
        }

        function switchEditMode() {
            document.getElementById('viewMode').classList.add('hidden');
            document.getElementById('editMode').classList.remove('hidden');
        }

        function switchViewMode() {
            document.getElementById('editMode').classList.add('hidden');
            document.getElementById('viewMode').classList.remove('hidden');
        }

        async function updateMemo() {
            const title = document.getElementById('editTitle').value;
            const content = document.getElementById('editContent').value;
            if(!title.trim()) return;

            try {
                await database.ref(`adminMemos/${currentMemoKey}`).update({
                    title: title,
                    content: content,
                    lastModified: Date.now()
                });
                switchViewMode();
                openModal(currentMemoKey); // 새로고침 효과
            } catch (e) { alert(e.message); }
        }

        async function handleDelete() {
            if(confirm("Permanently delete this memo?")) {
                await database.ref(`adminMemos/${currentMemoKey}`).remove();
                closeModal();
            }
        }
    </script>
</body>
</html>
