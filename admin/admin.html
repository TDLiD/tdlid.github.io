<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TDLiD Admin - Control Center</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/dark.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>

    <style>
        body {
            background-color: #020617;
            color: #e5e7eb;
            font-family: 'Pretendard', sans-serif;
        }

        .sidebar-item {
            transition: all 0.2s;
            border-radius: 12px;
        }

        .sidebar-item:hover,
        .sidebar-item.active {
            background: rgba(34, 211, 238, 0.1);
            color: #22d3ee;
        }

        .stat-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(34, 211, 238, 0.1);
            border-radius: 24px;
        }

        .dash-widget {
            background: linear-gradient(145deg, rgba(15, 23, 42, 0.9), rgba(30, 41, 59, 0.5));
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            transition: transform 0.3s ease;
        }

        .dash-widget:hover {
            transform: translateY(-3px);
            border-color: rgba(34, 211, 238, 0.3);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 22px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #1e293b;
            transition: .4s;
            border-radius: 22px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: #22d3ee;
        }

        input:checked+.slider:before {
            transform: translateX(22px);
        }

        #authOverlay {
            position: fixed;
            inset: 0;
            background: #020617;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ql-toolbar.ql-snow {
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.05) !important;
            border-radius: 12px 12px 0 0;
        }

        .ql-container.ql-snow {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.05) !important;
            border-radius: 0 0 12px 12px;
            min-height: 250px;
        }

        .ql-editor {
            color: #e5e7eb;
        }

        .ql-snow .ql-stroke {
            stroke: #94a3b8 !important;
        }

        .ql-snow .ql-fill {
            fill: #94a3b8 !important;
        }

        .ql-snow .ql-picker {
            color: #94a3b8 !important;
        }

        .slot-btn {
            transition: all 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(255, 255, 255, 0.02);
            color: #64748b;
        }

        .slot-btn.active {
            background: #22d3ee;
            color: #020617;
            font-weight: 700;
            box-shadow: 0 0 15px rgba(34, 211, 238, 0.4);
        }
    </style>
</head>

<body class="min-h-screen bg-[#020617]">

    <div id="authOverlay">
        <p class="text-cyan-400 font-bold tracking-widest animate-pulse">AUTHORIZING...</p>
    </div>

    <div id="sidebar-target"></div>

    <main class="w-full">
        <div class="max-w-[1600px] mx-auto p-8 space-y-8">
            <div class="mb-2">
                <h2 class="text-xl font-bold text-white flex items-center gap-2">
                    <span class="w-1 h-5 bg-cyan-500 rounded-full"></span>
                    System Configuration
                </h2>
            </div>

            <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                <div class="dash-widget p-5 flex items-center gap-4 cursor-pointer"
                    onclick="location.href='visitor.html'">
                    <div class="w-12 h-12 rounded-2xl bg-blue-500/10 flex items-center justify-center text-2xl">📊</div>
                    <div>
                        <p class="text-[10px] font-bold text-neutral-500 uppercase tracking-tighter">Total Visitors</p>
                        <h4 id="stat-visitors" class="text-xl font-black text-white">...</h4>
                    </div>
                </div>
                <div class="dash-widget p-5 flex items-center gap-4 cursor-pointer"
                    onclick="location.href='inquiry.html'">
                    <div class="w-12 h-12 rounded-2xl bg-emerald-500/10 flex items-center justify-center text-2xl">📩
                    </div>
                    <div>
                        <p class="text-[10px] font-bold text-neutral-500 uppercase tracking-tighter">Inquiries</p>
                        <h4 id="stat-inquiries" class="text-xl font-black text-white">...</h4>
                    </div>
                </div>
                <div class="dash-widget p-5 flex items-center gap-4 cursor-pointer" onclick="location.href='post.html'">
                    <div class="w-12 h-12 rounded-2xl bg-amber-500/10 flex items-center justify-center text-2xl">✍️
                    </div>
                    <div>
                        <p class="text-[10px] font-bold text-neutral-500 uppercase tracking-tighter">Posts</p>
                        <h4 id="stat-posts" class="text-xl font-black text-white">...</h4>
                    </div>
                </div>
                <div class="dash-widget p-5 flex items-center gap-4 cursor-pointer" onclick="location.href='memo.html'">
                    <div class="w-12 h-12 rounded-2xl bg-purple-500/10 flex items-center justify-center text-2xl">📝
                    </div>
                    <div>
                        <p class="text-[10px] font-bold text-neutral-500 uppercase tracking-tighter">Memos</p>
                        <h4 id="stat-memos" class="text-xl font-black text-white">...</h4>
                    </div>
                </div>
            </section>

            <section>
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-sm font-bold text-neutral-400 uppercase tracking-widest flex items-center gap-2">
                        <span class="w-2 h-2 bg-cyan-500 rounded-full"></span> Search Engine Optimization
                    </h3>
                </div>
                <div class="stat-card p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="lg:col-span-2 space-y-4">
                        <div>
                            <label class="text-[10px] font-bold text-neutral-500 uppercase block mb-1.5 ml-1">Site
                                Description</label>
                            <textarea id="seoDesc"
                                class="w-full bg-black/40 border border-white/5 rounded-2xl p-4 text-sm text-neutral-300 focus:border-cyan-500/50 outline-none transition h-24"></textarea>
                        </div>
                        <div>
                            <label
                                class="text-[10px] font-bold text-neutral-500 uppercase block mb-1.5 ml-1">Keywords</label>
                            <input type="text" id="seoKeywords"
                                class="w-full bg-black/40 border border-white/5 rounded-2xl p-4 text-sm text-neutral-300 focus:border-cyan-500/50 outline-none transition">
                        </div>
                        <button onclick="saveSEO()"
                            class="w-full py-3.5 bg-cyan-500 text-black font-bold rounded-2xl hover:bg-cyan-400 transition shadow-lg shadow-cyan-500/20 text-sm">Save
                            Meta Settings</button>
                    </div>
                    <div class="bg-cyan-500/5 rounded-2xl p-6 border border-cyan-500/10 flex flex-col justify-center">
                        <p class="text-cyan-500 text-xs font-bold mb-2">💡 SEO Guide</p>
                        <p class="text-neutral-400 text-xs leading-relaxed">KEEP UNDER 160 CHARACTERS. SEPARATE KEYWORDS
                            WITH COMMAS.</p>
                    </div>
                </div>
            </section>

            <section>
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-sm font-bold text-neutral-400 uppercase tracking-widest flex items-center gap-2">
                        <span class="w-2 h-2 bg-amber-500 rounded-full"></span> Notice & Popups
                    </h3>
                    <div class="flex gap-1.5 bg-black/40 p-1 rounded-xl border border-white/5">
                        <button onclick="switchPopup(0)"
                            class="slot-btn active px-3 py-1.5 rounded-lg text-[10px] font-bold">SLOT 1</button>
                        <button onclick="switchPopup(1)"
                            class="slot-btn px-3 py-1.5 rounded-lg text-[10px] font-bold">SLOT 2</button>
                        <button onclick="switchPopup(2)"
                            class="slot-btn px-3 py-1.5 rounded-lg text-[10px] font-bold">SLOT 3</button>
                        <button onclick="switchPopup(3)"
                            class="slot-btn px-3 py-1.5 rounded-lg text-[10px] font-bold">SLOT 4</button>
                        <button onclick="switchPopup(4)"
                            class="slot-btn px-3 py-1.5 rounded-lg text-[10px] font-bold">SLOT 5</button>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
                    <div class="lg:col-span-4 space-y-4">
                        <div class="stat-card p-5 flex items-center justify-between">
                            <div>
                                <p class="text-sm font-bold">Main Popup</p>
                            </div>
                            <label class="switch"><input type="checkbox" id="popupActive"><span
                                    class="slider"></span></label>
                        </div>
                        <div class="stat-card p-5 flex items-center justify-between">
                            <div>
                                <p class="text-sm font-bold text-amber-500">Emergency Banner</p>
                            </div>
                            <label class="switch"><input type="checkbox" id="bannerActive"><span
                                    class="slider"></span></label>
                        </div>
                        <div class="stat-card p-6 space-y-4">
                            <p class="text-[10px] font-bold text-neutral-500 uppercase tracking-widest">Active Schedule
                            </p>
                            <input type="text" id="startDate"
                                class="w-full bg-black/40 border border-white/5 rounded-xl p-3 text-xs outline-none"
                                placeholder="Start Date">
                            <input type="text" id="endDate"
                                class="w-full bg-black/40 border border-white/5 rounded-xl p-3 text-xs outline-none"
                                placeholder="End Date">
                        </div>
                    </div>

                    <div class="lg:col-span-8">
                        <div class="stat-card p-6 h-full flex flex-col">
                            <label class="text-[10px] font-bold text-neutral-500 uppercase mb-4">Editor (Slot <span
                                    id="slotDisplay" class="text-cyan-500">1</span>)</label>
                            <div id="editor-container" class="flex-1 min-h-[300px]"></div>
                            <button onclick="saveNotice()"
                                class="mt-4 w-full py-4 bg-white/5 hover:bg-white/10 border border-white/10 rounded-2xl text-white font-bold transition text-xs">UPDATE
                                SLOT DATA</button>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyDwF8_Q9S1-naaAgyfMWhFYJ2u_be3wsBs",
            authDomain: "tdlid-107669.firebaseapp.com",
            databaseURL: "https://tdlid-107669-default-rtdb.firebaseio.com",
            projectId: "tdlid-107669",
            storageBucket: "tdlid-107669.firebasestorage.app",
            messagingSenderId: "604782345004",
            appId: "1:604782345004:web:029aeaa81f4d11c2254a89"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const auth = firebase.auth();
        let quill;
        let currentSlot = 0;
        let popupDataList = [{}, {}, {}, {}, {}];

        // Initialize Page
        document.addEventListener('DOMContentLoaded', function () {
            quill = new Quill('#editor-container', {
                theme: 'snow',
                modules: { toolbar: [[{ 'header': [1, 2, false] }], ['bold', 'italic', 'underline'], ['image', 'code-block'], [{ 'color': [] }], ['clean']] }
            });
            const dateConfig = { dateFormat: "Y-m-d", locale: "default", disableMobile: "true" };
            flatpickr("#startDate", dateConfig);
            flatpickr("#endDate", dateConfig);

            // Sidebar load
            fetch('sidebar.html').then(r => r.text()).then(html => {
                document.getElementById('sidebar-target').innerHTML = html;
                const currentPage = window.location.pathname.split("/").pop() || 'admin.html';
                document.querySelectorAll('.sidebar-item').forEach(item => {
                    if (item.getAttribute('data-nav') === currentPage) item.classList.add('active');
                });
            });
        });

        // Auth Watcher
        auth.onAuthStateChanged((user) => {
            if (user) {
                document.getElementById('authOverlay').style.display = 'none';
                loadSettings();
                loadDashboardStats();
            } else {
                window.location.href = "login.html";
            }
        });

        function loadDashboardStats() {
            const refs = { 'visitorLogs': 'stat-visitors', 'messages': 'stat-inquiries', 'notices': 'stat-posts', 'adminMemos': 'stat-memos' };
            Object.keys(refs).forEach(path => {
                database.ref(path).on('value', snap => {
                    const el = document.getElementById(refs[path]);
                    if (el) el.innerText = snap.numChildren().toLocaleString();
                }, err => console.log(`${path} access pending...`));
            });
        }

        async function loadSettings() {
            try {
                // 1. SEO 설정 (허용된 경로)
                database.ref('siteSettings/seo').once('value').then(snap => {
                    if (snap.exists()) {
                        if (document.getElementById('seoDesc')) document.getElementById('seoDesc').value = snap.val().description || '';
                        if (document.getElementById('seoKeywords')) document.getElementById('seoKeywords').value = snap.val().keywords || '';
                    }
                }).catch(e => console.log("SEO load skipped or denied"));

                // 2. 팝업 설정 (허용된 경로)
                database.ref('siteSettings/popups').once('value').then(snap => {
                    if (snap.exists()) {
                        const data = snap.val();
                        for (let i = 0; i < 5; i++) { if (data[i]) popupDataList[i] = data[i]; }
                    }
                    displayCurrentPopup();
                }).catch(e => console.log("Popups load skipped or denied"));

                // [절대 금지] database.ref('adminConfig/password') 관련 코드는 이 세상 어디에도 없어야 합니다.

            } catch (e) {
                console.error("Settings Load Error:", e);
            }
        }


        function switchPopup(index) {
            currentSlot = index;
            document.querySelectorAll('.slot-btn').forEach((btn, i) => btn.classList.toggle('active', i === index));
            document.getElementById('slotDisplay').innerText = index + 1;
            displayCurrentPopup();
        }

        function displayCurrentPopup() {
            const data = popupDataList[currentSlot] || {};
            document.getElementById('popupActive').checked = data.popupActive || false;
            document.getElementById('bannerActive').checked = data.bannerActive || false;
            quill.root.innerHTML = data.content || '';
            if (data.startDate) document.getElementById('startDate')._flatpickr.setDate(data.startDate);
            else document.getElementById('startDate').value = '';
            if (data.endDate) document.getElementById('endDate')._flatpickr.setDate(data.endDate);
            else document.getElementById('endDate').value = '';
        }

        async function saveNotice() {
            const data = {
                popupActive: document.getElementById('popupActive').checked,
                bannerActive: document.getElementById('bannerActive').checked,
                content: quill.root.innerHTML,
                text: quill.getText(),
                startDate: document.getElementById('startDate').value,
                endDate: document.getElementById('endDate').value,
                updatedAt: Date.now()
            };
            popupDataList[currentSlot] = data;
            try {
                await database.ref('siteSettings/popups').set(popupDataList);
                alert("저장되었습니다.");
            } catch (e) { alert("저장 실패: " + e.message); }
        }

        async function saveSEO() {
            const description = document.getElementById('seoDesc').value;
            const keywords = document.getElementById('seoKeywords').value;
            try {
                await database.ref('siteSettings/seo').set({ description, keywords });
                alert("SEO 저장 완료");
            } catch (e) { alert("저장 실패: " + e.message); }
        }

        function logout() {
            if (confirm("로그아웃 하시겠습니까?")) {
                auth.signOut().then(() => { window.location.href = "login.html"; });
            }
        }
    </script>
</body>

</html>
