<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TDLiD Admin - Visitor Analytics</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { background-color: #020617; color: #e5e7eb; font-family: 'Pretendard', sans-serif; }
        .cyber-border { border: 1px solid rgba(34, 211, 238, 0.2); }
        .stat-card { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(34, 211, 238, 0.1); border-radius: 24px; }
        canvas { max-height: 250px !important; }
        #authOverlay { position: fixed; inset: 0; background: #020617; z-index: 9999; display: flex; align-items: center; justify-content: center; }
        
        .sidebar-item { transition: all 0.2s; border-radius: 12px; }
        .sidebar-item:hover, .sidebar-item.active { background: rgba(34, 211, 238, 0.1); color: #22d3ee; }
    </style>
</head>
<body class="min-h-screen bg-[#020617]"> <div id="authOverlay">
        <p class="text-cyan-400 font-bold tracking-widest animate-pulse">AUTHORIZING...</p>
    </div>

    <div id="sidebar-target"></div>

    <main class="w-full">
        <div class="max-w-[1600px] mx-auto p-8 space-y-8">
            <div class="mb-2">
                <h2 class="text-xl font-bold text-white flex items-center gap-2">
                    <span class="w-1 h-5 bg-cyan-500 rounded-full"></span>
                    Visitor Analytics
                </h2>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div class="stat-card p-6 text-center">
                    <p class="text-cyan-500 text-[10px] font-bold uppercase tracking-widest">Unique Visitors</p>
                    <h2 id="uniqueCount" class="text-3xl font-bold mt-1 font-mono text-white">0</h2>
                </div>
                <div class="stat-card p-6 text-center">
                    <p class="text-neutral-500 text-[10px] font-bold uppercase tracking-widest">Total Hits</p>
                    <h2 id="totalCount" class="text-3xl font-bold mt-1 font-mono text-neutral-400">0</h2>
                </div>
                <div class="stat-card p-6 md:col-span-2">
                    <p class="text-neutral-500 text-[10px] font-bold uppercase mb-2">Visitor Trend (7 Days)</p>
                    <div class="h-[150px]">
                        <canvas id="trendChart"></canvas>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="stat-card p-6">
                    <h3 class="text-sm font-bold text-cyan-400 mb-4 uppercase tracking-widest flex items-center gap-2">
                        <span class="w-2 h-2 bg-cyan-500 rounded-full"></span> Top Pages
                    </h3>
                    <div id="topPagesList" class="space-y-3">
                        <p class="text-xs text-neutral-600 italic">Calculating engine...</p>
                    </div>
                </div>
                
                <div class="lg:col-span-2 stat-card overflow-hidden flex flex-col">
                    <div class="p-5 border-b border-white/5 bg-white/[0.02] flex justify-between items-center">
                        <h3 class="text-xs font-bold text-neutral-400 uppercase tracking-widest">Live Activity Log</h3>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead class="bg-black/20 text-neutral-500 text-[9px] uppercase tracking-wider">
                                <tr>
                                    <th class="p-4 text-center">Hits</th>
                                    <th class="p-4">Time / IP Address</th>
                                    <th class="p-4">Location</th>
                                    <th class="p-4">Entry Page</th>
                                </tr>
                            </thead>
                            <tbody id="visitTableBody" class="divide-y divide-white/5 text-[11px]">
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDwF8_Q9S1-naaAgyfMWhFYJ2u_be3wsBs",
            authDomain: "tdlid-107669.firebaseapp.com",
            databaseURL: "https://tdlid-107669-default-rtdb.firebaseio.com",
            projectId: "tdlid-107669",
            storageBucket: "tdlid-107669.firebasestorage.app",
            messagingSenderId: "604782345004",
            appId: "1:604782345004:web:029aeaa81f4d11c2254a89"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const auth = firebase.auth();
        let trendChart = null;

        async function includeSidebar() {
            try {
                const response = await fetch('sidebar.html');
                const html = await response.text();
                document.getElementById('sidebar-target').innerHTML = html;

                const currentPage = window.location.pathname.split("/").pop() || 'admin.html';
                const navItems = document.querySelectorAll('.sidebar-item');
                navItems.forEach(item => {
                    if (item.getAttribute('data-nav') === currentPage) {
                        item.classList.add('active');
                        item.classList.remove('text-neutral-400');
                    }
                });
            } catch (error) {
                console.error('Sidebar load failed:', error);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            includeSidebar();
        });

        auth.onAuthStateChanged((user) => {
            if (user) {
                document.getElementById('authOverlay').style.display = 'none';
                startDataLoad();
            } else {
                window.location.href = "login.html";
            }
        });

        function startDataLoad() {
            database.ref('visits').on('value', (snapshot) => {
                let rawData = [];
                snapshot.forEach(c => { if(c.val().timestamp) rawData.push(c.val()); });
                rawData.sort((a, b) => b.timestamp - a.timestamp);

                document.getElementById('totalCount').innerText = rawData.length.toLocaleString();
                document.getElementById('uniqueCount').innerText = new Set(rawData.map(v => v.ip)).size.toLocaleString();

                updateTrendChart(rawData);
                updateTopPages(rawData);
                updateTable(rawData);
            });
        }

        function updateTrendChart(data) {
            const countsByDate = {};
            const last7Days = [...Array(7)].map((_, i) => {
                const d = new Date();
                d.setDate(d.getDate() - i);
                return d.toISOString().split('T')[0];
            }).reverse();

            data.forEach(v => {
                const date = new Date(v.timestamp).toISOString().split('T')[0];
                countsByDate[date] = (countsByDate[date] || 0) + 1;
            });

            const chartData = last7Days.map(date => countsByDate[date] || 0);
            const ctx = document.getElementById('trendChart').getContext('2d');
            
            if (trendChart) trendChart.destroy();
            
            trendChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: last7Days.map(d => d.slice(5)),
                    datasets: [{
                        label: 'Hits',
                        data: chartData,
                        borderColor: '#22d3ee',
                        backgroundColor: 'rgba(34, 211, 238, 0.1)',
                        fill: true,
                        tension: 0.4,
                        borderWidth: 2,
                        pointRadius: 4,
                        pointBackgroundColor: '#22d3ee'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { display: false },
                        x: { 
                            grid: { display: false }, 
                            ticks: { color: '#64748b', font: { size: 10, weight: 'bold' } } 
                        }
                    }
                }
            });
        }

        function updateTopPages(data) {
            const pages = {};
            data.forEach(v => {
                const p = v.page || '/';
                pages[p] = (pages[p] || 0) + 1;
            });

            const sorted = Object.entries(pages).sort((a, b) => b[1] - a[1]).slice(0, 6);
            const container = document.getElementById('topPagesList');
            container.innerHTML = sorted.map(([name, count]) => `
                <div class="flex justify-between items-center bg-white/[0.03] p-3 rounded-xl border border-white/5 hover:border-cyan-500/30 transition">
                    <span class="text-[10px] text-neutral-400 truncate mr-4 font-mono">${name}</span>
                    <span class="text-xs font-bold text-cyan-400">${count.toLocaleString()}</span>
                </div>
            `).join('');
        }

        function updateTable(rawData) {
            const tableBody = document.getElementById('visitTableBody');
            tableBody.innerHTML = '';
            
            const map = new Map();
            const groupedData = [];
            rawData.forEach(v => {
                const key = `${v.ip}_${v.os}`;
                if (!map.has(key)) {
                    const entry = { ...v, count: 1 };
                    map.set(key, entry);
                    groupedData.push(entry);
                } else { map.get(key).count += 1; }
            });

            groupedData.slice(0, 40).forEach(v => {
                const row = document.createElement('tr');
                row.className = "hover:bg-white/[0.02] transition border-b border-white/5";
                row.innerHTML = `
                    <td class="p-4 text-center">
                        <span class="bg-cyan-500/10 text-cyan-500 px-2 py-0.5 rounded-full text-[10px] font-black border border-cyan-500/20">${v.count}</span>
                    </td>
                    <td class="p-4">
                        <div class="text-neutral-500 text-[9px] mb-1">${v.timeStr || '-'}</div>
                        <div class="text-white font-mono font-bold tracking-tight">${v.ip || '0.0.0.0'}</div>
                    </td>
                    <td class="p-4">
                        <div class="text-neutral-300 font-bold">${v.country || 'Unknown'}</div>
                        <div class="text-neutral-600 text-[9px] uppercase tracking-tighter">${v.city || ''}</div>
                    </td>
                    <td class="p-4">
                        <span class="text-cyan-400/80 font-mono text-[10px] bg-cyan-400/5 px-2 py-1 rounded-md">${v.page || '/'}</span>
                    </td>`;
                tableBody.appendChild(row);
            });
        }
    </script>
</body>
</html>
