<style>
    .glass-header-m {
        background: rgba(2, 6, 23, 0.9) !important;
        backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(34, 211, 238, 0.3);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .animated-logo-text-m {
        background: linear-gradient(90deg, #fff, #22d3ee, #fff);
        background-size: 200% auto;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: shine 3s linear infinite;
        font-size: 3.8vw;
        white-space: nowrap;
    }

    @keyframes shine { to { background-position: 200% center; } }

    /* 드롭다운 메뉴 위치 및 스크롤 최적화 */
    #dropdownMenu {
        max-height: calc(100vh - 70px); 
        background: rgba(2, 6, 23, 0.98) !important;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
    }

    /* 언어 스위처 스타일 (기존 PC 스타일 계승) */
    .lang-switcher-m {
        display: none; /* 기본 숨김 */
        justify-content: center;
        gap: 20px;
        padding: 15px 0;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        margin-top: 10px;
    }
    .lang-btn-m {
        width: 35px;
        height: 22px;
        cursor: pointer;
        border-radius: 4px;
        overflow: hidden;
        filter: grayscale(100%);
        opacity: 0.5;
        transition: all 0.3s ease;
        border: 1px solid rgba(255,255,255,0.2);
    }
    .lang-btn-m.active {
        filter: grayscale(0%);
        opacity: 1;
        border-color: #22d3ee;
        box-shadow: 0 0 10px rgba(34, 211, 238, 0.4);
    }

    /* 네비게이션 아이템 스타일 */
    .nav-item-m {
        display: block;
        padding: 0.75rem 0;
        font-size: 1.125rem;
        font-weight: 700;
        color: white;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        transition: color 0.2s ease;
    }

    .nav-item-admin-m {
        font-size: 0.75rem !important;
        color: #4b5563 !important;
        text-transform: uppercase;
        border-bottom: none !important;
        margin-top: 1rem;
        text-align: center;
        opacity: 0.6;
    }

    .nav-item-m.active-m {
        color: #22d3ee !important;
        border-bottom-color: rgba(34, 211, 238, 0.3);
    }

    @media (max-width: 380px) {
        .animated-logo-text-m { font-size: 11px; }
        .glass-header-m { padding-left: 12px !important; padding-right: 12px !important; }
    }
</style>

<script>
    // [다국어 로직] PC와 동일
    function setLanguage(lang) {
        localStorage.setItem('selectedLang', lang);
        
        // 버튼 활성화 표시
        document.querySelectorAll('.lang-btn-m').forEach(btn => {
            btn.classList.remove('active');
            if(btn.dataset.lang === lang) btn.classList.add('active');
        });

        // 페이지 내 번역 함수 호출 (contact_m.html에 정의된 경우)
        if (typeof applyLanguage === 'function') {
            applyLanguage(lang);
        }
        
        // 헤더 버튼 텍스트 변경
        updateHeaderTextM(lang);
    }

    function updateHeaderTextM(lang) {
        const texts = {
            en: "Talk to us 👉",
            id: "Hubungi Kami 👉"
        };
        const btn = document.querySelector('.btn-contact-m');
        if(btn) btn.innerText = texts[lang] || texts.en;
    }

    function initNavigationM() {
        const path = window.location.pathname.split("/").pop() || 'index_m.html';
        const isContactPage = path === 'contact_m.html';

        // 1. Contact 페이지인 경우에만 언어 스위처 노출
        const switcher = document.getElementById('langSwitcherM');
        if (switcher && isContactPage) {
            switcher.style.display = 'flex';
        }

        // 2. 초기 언어 설정 적용
        const savedLang = localStorage.getItem('selectedLang') || 'en';
        setLanguage(savedLang);

        // 3. 현재 탭 활성화 표시
        document.querySelectorAll('.nav-item-m').forEach(link => {
            if (link.getAttribute('href') === path) {
                link.classList.add('active-m');
            }
        });
    }

    // 관리자 인증 로직
function openAdminAuth() {
    const modal = document.getElementById('adminAuthModal');
    if (modal) {
        modal.classList.remove('hidden');
        const input = document.getElementById('adminPasswordInput');
        if (input) { input.value = ''; input.focus(); }
        document.body.style.overflow = 'hidden';
    }
}

    // 초기화 실행
    if (document.readyState === 'complete') initNavigationM();
    else document.addEventListener('DOMContentLoaded', initNavigationM);
</script>

<header class="fixed top-0 left-0 w-full z-[10001] glass-header-m px-4 py-4 flex justify-between items-center">
    <a href="index_m.html" class="flex items-center gap-2 max-w-[75%] overflow-hidden">
        <img src="images/logo/logo.gif" class="h-8 w-auto flex-shrink-0" alt="Logo">
        <div class="flex flex-col min-w-0">
            <span class="animated-logo-text-m font-black tracking-tight truncate">
                TDL ENERGY INDONESIA
            </span>
        </div>
    </a>

    <button id="menuToggleBtn" class="flex-shrink-0 p-2 border border-cyan-500/30 rounded-lg active:bg-cyan-500/20 ml-2 transition-all">
        <span id="menuIcon" class="text-cyan-400 text-xl font-bold block w-6 h-6 flex items-center justify-center">☰</span>
    </button>

    <div id="dropdownMenu" class="absolute top-[100%] left-0 w-full opacity-0 invisible -translate-y-5 transition-all duration-300 shadow-2xl border-b border-cyan-500/20">
        <nav class="flex flex-col p-6 space-y-1">
            <a href="index_m.html" class="nav-item-m">Home</a>
            <a href="products_m.html" class="nav-item-m">Products</a>
            <a href="technology_m.html" class="nav-item-m">Technology</a>
            <a href="solutions_m.html" class="nav-item-m">Solutions</a>
            <a href="company_m.html" class="nav-item-m">Company</a>
            <a href="news_m.html" class="nav-item-m">News</a>
            <a href="notice_m.html" class="nav-item-m" id="nav-notice-m">Notice</a>
            
            <div id="langSwitcherM" class="lang-switcher-m">
                <div onclick="setLanguage('en')" class="lang-btn-m" data-lang="en">
                    <img src="https://flagcdn.com/w40/gb.png" class="w-full h-full object-cover">
                </div>
                <div onclick="setLanguage('id')" class="lang-btn-m" data-lang="id">
                    <img src="https://flagcdn.com/w40/id.png" class="w-full h-full object-cover">
                </div>
            </div>

<a href="javascript:void(0)" onclick="openAdminAuth()" class="nav-item-m nav-item-admin-m" style="font-size:1.3rem;opacity:0.4;text-decoration:none;">
    🛡️
</a>
            
            <div class="pt-6">
                <a href="contact_m.html" class="btn-contact-m w-full py-4 bg-cyan-400 text-black text-center font-black rounded-xl block shadow-[0_0_15px_rgba(34,211,238,0.4)] active:scale-[0.98] transition-transform">
                    Talk to us 👉
                </a>
            </div>
        </nav>
    </div>
</header>
