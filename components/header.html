<style>
    /* 1. 상/하 라인 강조형 오픈 3D 헤더 */
    .glass-header {
        background: rgba(2, 6, 23, 0.75) !important;
        backdrop-filter: blur(15px) saturate(180%);
        -webkit-backdrop-filter: blur(15px) saturate(180%);
        border-top: 1px solid rgba(255, 255, 255, 0.15) !important;
        border-bottom: 1px solid rgba(34, 211, 238, 0.2) !important;
        box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
        transition: all 0.3s ease;
    }

    /* 하단 네온 장식 라인 */
    .header-frame-deco {
        position: absolute;
        bottom: -1px;
        left: 0;
        height: 2px;
        background: linear-gradient(90deg, transparent 0%, rgba(34, 211, 238, 0.8) 50%, transparent 100%);
        width: 100%;
        opacity: 0.7;
    }

    /* 로고 애니메이션 */
    .animated-logo-text {
        letter-spacing: 0.15em;
        background: linear-gradient(90deg, #fff, #22d3ee, #fff);
        background-size: 200% auto;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: shine 3s linear infinite;
    }

    @keyframes shine {
        to {
            background-position: 200% center;
        }
    }

    /* 메뉴 순차 등장 애니메이션 */
    @keyframes zoomInEntrance {
        from {
            opacity: 0;
            transform: scale(1.5) translateY(-10px);
            filter: blur(5px);
        }

        to {
            opacity: 1;
            transform: scale(1) translateY(0);
            filter: blur(0);
        }
    }

    /* 초기 상태 숨김 처리 및 애니메이션 */
    #main-nav li,
    .nav-btn-container {
        opacity: 0;
        animation: zoomInEntrance 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    /* 순차적 지연 시간 */
    #main-nav li:nth-child(1) {
        animation-delay: 0.1s;
    }

    #main-nav li:nth-child(2) {
        animation-delay: 0.2s;
    }

    #main-nav li:nth-child(3) {
        animation-delay: 0.3s;
    }

    #main-nav li:nth-child(4) {
        animation-delay: 0.4s;
    }

    #main-nav li:nth-child(5) {
        animation-delay: 0.5s;
    }

    #main-nav li:nth-child(6) {
        animation-delay: 0.6s;
    }

    #main-nav li:nth-child(7) {
        animation-delay: 0.7s;
    }

    #main-nav li:nth-child(8) {
        animation-delay: 0.8s;
    }

    /* Admin */
    .nav-btn-container {
        animation-delay: 0.9s;
    }

    .nav-link {
        position: relative;
        color: #94a3b8;
        transition: all 0.3s ease;
        padding: 4px 0;
        white-space: nowrap;
        display: inline-block;
    }

    .nav-link:hover,
    .nav-link.active-tab {
        color: #22d3ee !important;
        transform: translateY(-2px);
        text-shadow: 0 0 10px rgba(34, 211, 238, 0.5);
    }

    .btn-neon {
        display: inline-flex !important;
        align-items: center;
        justify-content: center;
        width: 150px !important;
        height: 42px !important;
        background: rgba(15, 23, 42, 0.6) !important;
        border: 1px solid rgba(34, 211, 238, 0.5);
        transition: all 0.3s ease;
    }

    .btn-neon:hover {
        background: #22d3ee !important;
        color: #000 !important;
        box-shadow: 0 0 20px rgba(34, 211, 238, 0.6);
    }

    #dropdownMenu {
        background: rgba(15, 23, 42, 0.98) !important;
        border: 1px solid rgba(34, 211, 238, 0.3);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
    }

    .nav-item-m {
        transition: all 0.2s;
        border: 1px solid transparent;
    }

    .nav-item-m:hover {
        background: rgba(34, 211, 238, 0.1);
        color: #22d3ee;
    }


    /* Admin 클릭 문제 해결 */
    #main-nav li:last-child,
    #main-nav li:last-child a {
        pointer-events: auto !important;
        position: relative;
        z-index: 10010;
    }

    /* 장식 요소 클릭 차단 */
    .header-frame-deco {
        pointer-events: none;
    }

    /* 헤더 클릭 우선권 확보 */
    .glass-header {
        position: relative;
        z-index: 10001;
    }

    /* ... 기존 스타일 유지 ... */
    .glass-header {
        background: rgba(2, 6, 23, 0.75) !important;
        backdrop-filter: blur(15px) saturate(180%);
        -webkit-backdrop-filter: blur(15px) saturate(180%);
        border-top: 1px solid rgba(255, 255, 255, 0.15) !important;
        border-bottom: 1px solid rgba(34, 211, 238, 0.2) !important;
        box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
        transition: all 0.3s ease;
        position: relative;
        z-index: 10001;
    }

    /* 언어 스위처 스타일 추가 */
    .lang-switcher-container {
        display: none !important;
        /* 기본적으로 모든 페이지에서 숨김 */
        align-items: center;
        gap: 8px;
        margin-left: 15px;
        padding-left: 15px;
        border-left: 1px solid rgba(255, 255, 255, 0.1);
    }

    .lang-btn {
        width: 28px;
        height: 20px;
        cursor: pointer;
        transition: all 0.3s ease;
        border-radius: 2px;
        overflow: hidden;
        filter: grayscale(100%);
        opacity: 0.4;
    }

    .lang-btn.active {
        filter: grayscale(0%);
        opacity: 1;
        box-shadow: 0 0 10px rgba(34, 211, 238, 0.5);
        outline: 1px solid #22d3ee;
    }

    .lang-btn:hover {
        opacity: 1;
        filter: grayscale(0%);
    }

    /* 하단 생략 (기존 스타일 코드와 동일) */
    .header-frame-deco {
        position: absolute;
        bottom: -1px;
        left: 0;
        height: 2px;
        background: linear-gradient(90deg, transparent 0%, rgba(34, 211, 238, 0.8) 50%, transparent 100%);
        width: 100%;
        opacity: 0.7;
        pointer-events: none;
    }

    .nav-link {
        position: relative;
        color: #94a3b8;
        transition: all 0.3s ease;
        padding: 4px 0;
        white-space: nowrap;
        display: inline-block;
    }

    .nav-link:hover,
    .nav-link.active-tab {
        color: #22d3ee !important;
        transform: translateY(-2px);
        text-shadow: 0 0 10px rgba(34, 211, 238, 0.5);
    }

    .btn-neon {
        display: inline-flex !important;
        align-items: center;
        justify-content: center;
        width: 140px !important;
        height: 40px !important;
        background: rgba(15, 23, 42, 0.6) !important;
        border: 1px solid rgba(34, 211, 238, 0.5);
        transition: all 0.3s ease;
    }

    #dropdownMenu {
        background: rgba(15, 23, 42, 0.98) !important;
        border: 1px solid rgba(34, 211, 238, 0.3);
    }
</style>

<script>
    // [다국어 로직] 언어 설정 및 적용
    function setLanguage(lang) {
        localStorage.setItem('selectedLang', lang);

        // 버튼 활성화 표시
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.classList.remove('active');
            if (btn.dataset.lang === lang) btn.classList.add('active');
        });

        // 현재 페이지가 contact.html인 경우 등 각 페이지의 applyLanguage 함수 호출
        if (typeof applyLanguage === 'function') {
            applyLanguage(lang);
        }

        // 헤더 자체의 텍스트 변경이 필요한 경우 여기서 처리 (예: 메뉴명 등)
        updateHeaderStaticText(lang);
    }

    function updateHeaderStaticText(lang) {
        const headerText = {
            en: { contact: "Talk to Us", quote: "Request Quote" },
            id: { contact: "Hubungi Kami", quote: "Minta Penawaran" }
        };
        const t = headerText[lang];
        document.querySelectorAll('.btn-neon').forEach(el => el.innerText = t.contact);
        const mobileQuote = document.querySelector('#mobile-nav-container .bg-cyan-400');
        if (mobileQuote) mobileQuote.innerText = t.quote;
    }

    function openAdminAuth() {
        const modal = document.getElementById('adminAuthModal');
        if (modal) {
            modal.classList.remove('hidden');
            document.getElementById('adminPasswordInput').focus();
            return;
        }
        const pw = prompt("Password:");
        if (!pw) return;
        const db = (typeof database !== 'undefined') ? database : firebase.database();
        db.ref('adminConfig/password').once('value').then((snapshot) => {
            if (pw === snapshot.val()) { window.location.href = "admin.html"; }
            else { alert("Wrong password."); }
        });
    }

    function initNavigation() {
        const menuBtn = document.getElementById('menuToggleBtn');
        const dropdown = document.getElementById('dropdownMenu');
        const menuIcon = document.getElementById('menuIcon');

        // --- 추가된 로직: Contact 페이지에서만 국기 표시 ---
        const path = window.location.pathname.split("/").pop() || 'index.html';
        const isContactPage = path === 'contact.html' || path === 'contact_m.html';

        // PC용 국기 컨테이너
        const langSwitcher = document.querySelector('.lang-switcher-container');
        if (langSwitcher && isContactPage) {
            langSwitcher.style.setProperty('display', 'flex', 'important');
        }

        // 모바일용 국기 컨테이너 (드롭다운 메뉴 내부)
        const mobileLangSwitcher = document.querySelector('#mobile-nav-container .border-t');
        if (mobileLangSwitcher) {
            if (isContactPage) {
                mobileLangSwitcher.style.display = 'block';
            } else {
                mobileLangSwitcher.style.display = 'none';
            }
        }
        // ----------------------------------------------

        if (menuBtn && dropdown) {
            menuBtn.onclick = (e) => {
                e.stopPropagation();
                const isVisible = !dropdown.classList.contains('invisible');
                if (isVisible) {
                    dropdown.classList.add('opacity-0', 'invisible', '-translate-y-5');
                    if (menuIcon) menuIcon.innerText = "☰";
                } else {
                    dropdown.classList.remove('opacity-0', 'invisible', '-translate-y-5');
                    dropdown.classList.add('opacity-100', 'visible', 'translate-y-0');
                    if (menuIcon) menuIcon.innerText = "✕";
                }
            };
        }

        // 초기 언어 설정 로드
        const savedLang = localStorage.getItem('selectedLang') || 'en';
        setLanguage(savedLang);

        // 현재 활성 탭 표시
        document.querySelectorAll('.nav-link, .nav-item-m').forEach(link => {
            if (link.getAttribute('href') === path) {
                link.classList.add('active-tab');
            }
        });
    }

    if (document.readyState === 'complete') initNavigation();
    else document.addEventListener('DOMContentLoaded', initNavigation);
</script>
