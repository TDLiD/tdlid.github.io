<style>
    .glass-footer {
        background: linear-gradient(to top, rgba(2, 6, 23, 0.95), rgba(2, 6, 23, 0.8));
        backdrop-filter: blur(15px);
        border-top: 1px solid rgba(34, 211, 238, 0.3);
        position: relative;
        overflow: hidden;
    }

    /* 상단 네온 라인 */
    .footer-neon-line {
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 180px;
        height: 2px;
        background: #22d3ee;
        box-shadow: 0 0 20px #22d3ee, 0 0 40px #22d3ee;
    }

    /* 하트 이스터에그 트리거 스타일 수정 */
    #pcHeartTrigger {
        cursor: default !important;
        /* 커서 모양을 일반 텍스트와 같게 수정 */
        transition: color 0.3s ease;
    }

    #pcHeartTrigger:hover {
        color: #22d3ee;
        /* 호버 시 색상 변화는 유지 (필요 없으시면 이 블록을 삭제하세요) */
    }

    .footer-bottom-text {
        cursor: default;
        user-select: none;
    }

    .wa-contact-wrapper {
        position: absolute;
        left: 24px;
        bottom: 15px;
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 12px;
        z-index: 20;
    }

    .qr-container {
        background: rgba(255, 255, 255, 0.9);
        padding: 4px;
        border-radius: 8px;
        box-shadow: 0 0 15px rgba(34, 211, 238, 0.2);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        cursor: pointer;
    }

    .qr-container:hover {
        transform: scale(1.05) translateY(-3px);
        background: #ffffff;
        box-shadow: 0 0 20px rgba(34, 211, 238, 0.5);
    }

    .qr-image {
        width: 60px;
        height: 60px;
        display: block;
        object-fit: contain;
    }

    .wa-icon-link {
        transition: transform 0.3s ease;
        display: flex;
        align-items: center;
    }

    .wa-icon-link:hover {
        transform: scale(1.1);
    }

    .wa-image {
        width: 60px;
        height: 60px;
        object-fit: contain;
    }

    @media (max-width: 768px) {
        .wa-contact-wrapper {
            position: static;
            margin: 20px auto 10px;
            justify-content: center;
            gap: 15px;
        }

        .qr-image,
        .wa-image {
            width: 48px;
            height: 48px;
        }
    }
</style>

<footer class="glass-footer py-6 px-6 mt-10">
    <div class="footer-neon-line"></div>

    <div class="max-w-7xl mx-auto flex flex-col gap-4">
        <div class="flex flex-col md:flex-row items-center justify-center gap-4 md:gap-8">
            <p class="text-neutral-300 text-sm font-medium tracking-tight">
                <span id="pcHeartTrigger">TDL Energy Indonesia</span>
                <span class="mx-2 text-neutral-600">|</span> Driving the Future of Mobility
            </p>
        </div>

        <div class="flex flex-col md:flex-row items-center justify-center gap-2 md:gap-6 border-t border-white/5 pt-4">
            <p class="text-neutral-500 text-[11px] font-light">
                © 2025 TDL Energy Indonesia. All rights reserved.
            </p>

            <div class="hidden md:block w-1 h-1 rounded-full bg-cyan-500/30"></div>

            <p class="text-[10px] text-neutral-600 uppercase tracking-[0.2em] font-light footer-bottom-text">
                No More Carbon <span class="text-cyan-900 mx-1">·</span>
                Innovation
                <span class="text-cyan-900 mx-1">·</span> Sustainability
            </p>
        </div>
    </div>

    <div class="wa-contact-wrapper">
        <div class="qr-container" onclick="window.open('https://wa.me/6281296075099', '_blank')">
            <img src="images/footer/qr.png" alt="WhatsApp QR" class="qr-image">
        </div>
        <a href="https://wa.me/6281296075099" target="_blank" class="wa-icon-link">
            <img src="images/footer/whatsapp.png" alt="WhatsApp" class="wa-image">
        </a>
    </div>
</footer>

<script>
    (function () {
        /* --- 하트 이스터에그 로직 --- */
        let isHeartRunning = false;
        const trigger = document.getElementById('pcHeartTrigger');

        const points = [
            { x: 0, y: 0 }, { x: 1, y: 0 }, { x: 2, y: 0 }, { x: 1, y: 1 }, { x: 1, y: 2 }, { x: 1, y: 3 }, { x: 1, y: 4 },
            { x: 3.5, y: 0 }, { x: 3.5, y: 1 }, { x: 3.5, y: 2 }, { x: 3.5, y: 3 }, { x: 3.5, y: 4 }, { x: 4.5, y: 0 }, { x: 5.5, y: 1 }, { x: 5.5, y: 2 }, { x: 5.5, y: 3 }, { x: 4.5, y: 4 },
            { x: 7, y: 0 }, { x: 7, y: 1 }, { x: 7, y: 2 }, { x: 7, y: 3 }, { x: 7, y: 4 }, { x: 8, y: 4 }, { x: 9, y: 4 },
            { x: 10.5, y: 0.5 }, { x: 10.5, y: 2 }, { x: 10.5, y: 3 }, { x: 10.5, y: 4 },
            { x: 12, y: 0 }, { x: 12, y: 1 }, { x: 12, y: 2 }, { x: 12, y: 3 }, { x: 12, y: 4 }, { x: 13, y: 0 }, { x: 14, y: 1 }, { x: 14, y: 2 }, { x: 14, y: 3 }, { x: 13, y: 4 }
        ];

        if (trigger) {
            trigger.onclick = (e) => {
                e.preventDefault();
                if (isHeartRunning) return;
                isHeartRunning = true;

                const hearts = [];
                const sw = window.innerWidth;
                const sh = window.innerHeight;

                points.forEach((p, i) => {
                    const heart = document.createElement('div');
                    heart.innerHTML = '❤️';
                    heart.style.cssText = `
                    position: fixed; left: ${Math.random() * 100}vw; top: ${Math.random() * 100}vh;
                    font-size: 22px; z-index: 99999; opacity: 0;
                    pointer-events: none; transition: all 1.2s cubic-bezier(0.19, 1, 0.22, 1);
                `;
                    document.body.appendChild(heart);
                    hearts.push({ el: heart, target: p });
                    setTimeout(() => { heart.style.opacity = '1'; }, i * 10);
                });

                setTimeout(() => {
                    const gapSize = Math.min(sw / 20, 45);
                    const totalWidth = 14 * gapSize;
                    const startX = (sw - totalWidth) / 2;
                    const startY = (sh / 2) - (2 * gapSize);
                    hearts.forEach((obj) => {
                        obj.el.style.transition = "all 1.5s cubic-bezier(0.68, -0.55, 0.265, 1.55)";
                        obj.el.style.left = (startX + obj.target.x * gapSize) + 'px';
                        obj.el.style.top = (startY + obj.target.y * gapSize) + 'px';
                        obj.el.style.transform = `scale(1.5)`;
                        obj.el.style.textShadow = "0 0 15px rgba(34, 211, 238, 0.6)";
                    });
                }, 1200);

                setTimeout(() => {
                    const centerX = sw / 2;
                    const centerY = sh / 2;
                    const heartScale = Math.min(sw, sh) / 28;
                    hearts.forEach((obj, i) => {
                        const t = (i / hearts.length) * 2 * Math.PI;
                        const hx = 16 * Math.pow(Math.sin(t), 3);
                        const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
                        obj.el.style.transition = "all 2s cubic-bezier(0.25, 1, 0.5, 1)";
                        obj.el.style.left = (centerX + hx * heartScale) + 'px';
                        obj.el.style.top = (centerY + hy * heartScale) + 'px';
                        obj.el.style.transform = `scale(2.2) rotate(${(Math.random() - 0.5) * 30}deg)`;
                        obj.el.style.textShadow = "0 0 20px rgba(255, 0, 0, 0.8)";
                    });
                }, 4500);

                setTimeout(() => {
                    hearts.forEach(obj => {
                        obj.el.style.transition = "all 1.5s ease-in";
                        obj.el.style.opacity = '0';
                        obj.el.style.transform = `translate(${(Math.random() - 0.5) * 500}px, ${(Math.random() - 0.5) * 500}px) scale(0)`;
                        setTimeout(() => obj.el.remove(), 1500);
                    });
                    isHeartRunning = false;
                }, 8500);
            };
        }
    })();
</script>
