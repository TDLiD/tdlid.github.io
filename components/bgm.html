<style>
    #musicToggleBtn {
        position: fixed;
        bottom: 25px;
        right: 25px;
        z-index: 10005;
        width: 44px;
        height: 44px;
        background: rgba(23, 23, 23, 0.8);
        border: 1px solid rgba(34, 211, 238, 0.4);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: #22d3ee;
        backdrop-filter: blur(4px);
        transition: all 0.3s;
    }

    #musicToggleBtn:hover {
        transform: scale(1.1);
        border-color: #22d3ee;
    }
</style>

<audio id="bgm" src="mp3/tdlid.mp3" loop muted preload="auto" playsinline></audio>

<button id="musicToggleBtn" title="Play/Pause Music">
    <span id="musicIconUI">🔇</span>
</button>

<script>
    (function () {
        const bgm = document.getElementById('bgm');
        const musicBtn = document.getElementById('musicToggleBtn');
        const musicIcon = document.getElementById('musicIconUI');

        // 1. 상태 복원 및 재생 로직
        const initBGM = () => {
            const savedTime = sessionStorage.getItem('bgmTime');
            const isMuted = sessionStorage.getItem('bgmMuted'); // 'true' 또는 'false'

            // 저장된 재생 위치가 있으면 복원
            if (savedTime) {
                bgm.currentTime = parseFloat(savedTime);
            }

            // 사용자가 이전에 음악을 켰던 상태(false)라면 재생 시도
            if (isMuted === 'false') {
                bgm.muted = false;

                // [A] 즉시 재생 시도 (데스크톱 및 정책 허용 기기)
                bgm.play().then(() => {
                    musicIcon.innerText = "🎵";
                }).catch(() => {
                    // [B] 자동 재생이 막힌 경우 (모바일 등) 사용자의 첫 클릭 시 재생되도록 대기
                    console.log("Autoplay blocked. Waiting for user interaction.");
                    musicIcon.innerText = "🔇";

                    const playOnGesture = () => {
                        bgm.muted = false;
                        bgm.play().then(() => {
                            musicIcon.innerText = "🎵";
                            document.removeEventListener('click', playOnGesture);
                        });
                    };
                    document.addEventListener('click', playOnGesture);
                });
            }
        };

        if (musicBtn && bgm) {
            initBGM();

            // 2. 수동 토글 버튼 클릭 이벤트
            musicBtn.onclick = (e) => {
                e.stopPropagation(); // document 클릭 이벤트 전파 차단
                if (bgm.muted || bgm.paused) {
                    bgm.muted = false;
                    bgm.play();
                    musicIcon.innerText = "🎵";
                    sessionStorage.setItem('bgmMuted', 'false');
                } else {
                    bgm.muted = true;
                    musicIcon.innerText = "🔇";
                    sessionStorage.setItem('bgmMuted', 'true');
                }
            };

            // 3. 실시간 상태 저장 (1초 간격)
            setInterval(() => {
                if (bgm.currentTime > 0) {
                    sessionStorage.setItem('bgmTime', bgm.currentTime);
                }
            }, 1000);

            // 4. 페이지를 떠날 때 상태 확실히 저장
            window.addEventListener('beforeunload', () => {
                sessionStorage.setItem('bgmTime', bgm.currentTime);
                sessionStorage.setItem('bgmMuted', bgm.muted);
            });
        }
    })();
</script>
